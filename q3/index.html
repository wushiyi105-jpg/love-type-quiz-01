<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="放弃 3 个，猜你的 MBTI。8 道舍弃题，先划掉你最不舍得的那项，生成可保存的四色象限结果卡。" />
  <title>放弃 3 个，猜你的 MBTI</title>
  <style>

    :root {
      --paper: #F7F8FA;
      --cream: #F7F8FA;
      --ink: #14151A;
      --ink-soft: #5C6170;
      --ink-faint: #8B90A0;
      --strike: #E11D48;
      --strike-soft: #FFF1F3;
      --rose: #E11D48;
      --rose-deep: #BE123C;
      --rose-soft: rgba(225, 29, 72, 0.12);
      --nt: #7C4DFF;
      --nf: #10B981;
      --sj: #2563EB;
      --sp: #F59E0B;
      --sand: #ECEEF3;
      --sand-dark: #E2E5EC;
      --card: #FFFFFF;
      --line: #14151A;
      --line-soft: rgba(20, 21, 26, 0.14);
      --shadow: 3px 3px 0 rgba(20, 21, 26, 0.10);
      --font-serif: "Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --font-sans: "Noto Sans CJK SC", "Noto Sans CJK", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }
    button {
      font-family: inherit;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    img { display: block; max-width: 100%; }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      background:
        linear-gradient(180deg, rgba(124, 77, 255, 0.06), transparent 28%),
        linear-gradient(120deg, rgba(16, 185, 129, 0.04), transparent 30%),
        linear-gradient(300deg, rgba(245, 158, 11, 0.05), transparent 32%),
        var(--paper);
    }

    .view {
      display: none;
      min-height: 100dvh;
      padding: calc(24px + var(--safe-top)) 22px calc(28px + var(--safe-bottom));
      animation: rise 0.48s ease both;
    }
    .view.is-on { display: flex; flex-direction: column; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Home ===== */
    .home-top { padding-top: 10px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ink-faint);
      text-transform: none;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      flex: 0 0 18px;
      height: 2px;
      background: var(--ink);
      opacity: 0.18;
    }
    .eyebrow::before { flex: 0 0 22px; }
    .home-eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 22px; }

    .home-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(32px, 9.2vw, 40px);
      line-height: 1.22;
      letter-spacing: 0.04em;
      text-align: center;
      font-feature-settings: "kern";
    }
    .home-title em { font-style: normal; }
    .home-title .mbti {
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .home-title .mbti i { font-style: normal; }
    .c-nt { color: var(--nt); }
    .c-nf { color: var(--nf); }
    .c-sj { color: var(--sj); }
    .c-sp { color: var(--sp); }

    .chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 14px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 5px 11px;
      box-shadow: 2px 2px 0 rgba(20, 21, 26, 0.08);
    }
    .chip.chip-nt { border-color: var(--nt); color: var(--nt); background: rgba(124, 77, 255, 0.08); }
    .chip.chip-nf { border-color: var(--nf); color: #059669; background: rgba(16, 185, 129, 0.10); }
    .chip.chip-sj { border-color: var(--sj); color: var(--sj); background: rgba(37, 99, 235, 0.08); }
    .chip.chip-sp { border-color: var(--sp); color: #B45309; background: rgba(245, 158, 11, 0.14); }

    .strike-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 22px;
    }
    .strike-chip {
      position: relative;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      line-height: 1.2;
    }
    .strike-chip.is-off {
      color: #8B90A0;
      border-color: var(--strike);
      background: var(--strike-soft);
      text-decoration: line-through;
      text-decoration-color: var(--strike);
      text-decoration-thickness: 2px;
      text-decoration-skip-ink: none;
    }
    .strike-chip.is-off::after {
      content: "";
      position: absolute;
      inset: -7px -8px;
      border: 2px solid var(--strike);
      border-radius: 50%;
      transform: rotate(-8deg);
      pointer-events: none;
      opacity: 0.92;
    }

    .home-lead {
      text-align: center;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 20.5em;
      margin: 0 auto 32px;
    }

    .cta-primary {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 12px;
      height: 52px;
      font-size: 16px;
      letter-spacing: 0.16em;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .cta-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .home-meta {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.7;
      letter-spacing: 0.04em;
    }

    .home-footer {
      margin-top: auto;
      padding-top: 36px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.08em;
    }

    .ornament {
      width: 18px;
      height: 18px;
      margin: 0 auto 22px;
      border: 2px solid var(--strike);
      border-radius: 50%;
      position: relative;
      opacity: 1;
    }
    .ornament::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 2px;
      background: var(--strike);
      transform: translate(-50%, -50%) rotate(-28deg);
    }

    /* ===== Quiz ===== */
    .quiz-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 2px solid var(--ink);
      display: grid;
      place-items: center;
      color: var(--ink);
      background: #fff;
      flex: 0 0 36px;
      box-shadow: 2px 2px 0 rgba(20, 21, 26, 0.10);
      transition: transform 0.12s ease;
    }
    .back-btn:disabled { opacity: 0.3; box-shadow: none; }
    .back-btn:not(:disabled):active { transform: translate(1px, 1px); }
    .progress-wrap { flex: 1; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 6px;
      background: var(--sand-dark);
      border: 2px solid var(--ink);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--nt), var(--nf), var(--sj), var(--sp));
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .q-kicker {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--strike);
      font-weight: 700;
    }
    .q-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 21px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 8px 0 20px;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      text-align: left;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 12px 12px 12px 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 3px 3px 0 rgba(20, 21, 26, 0.10);
      transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }
    .option:active { transform: translate(1px, 1px); }
    .option.is-picked {
      border-color: var(--strike);
      background: var(--strike-soft);
      box-shadow: 3px 3px 0 rgba(225, 29, 72, 0.28);
    }
    .opt-key {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      letter-spacing: 0;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
      margin-top: 1px;
      position: relative;
    }
    .option.is-picked .opt-key {
      background: var(--strike);
      border-color: var(--strike);
      color: transparent;
    }
    .option.is-picked .opt-key::after {
      content: "✕";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .opt-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      padding-top: 1px;
    }
    .option.is-picked .opt-text {
      color: #6B717C;
      text-decoration: line-through;
      text-decoration-color: var(--strike);
      text-decoration-thickness: 2.5px;
      text-decoration-skip-ink: none;
    }

    /* ===== Generating / Result ===== */
    .gen-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .gen-mark {
      width: 18px;
      height: 18px;
      border: 2px solid var(--strike);
      border-radius: 50%;
      position: relative;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .gen-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 2px;
      background: var(--strike);
      transform: translate(-50%, -50%) rotate(-28deg);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .gen-text {
      font-family: var(--font-serif);
      font-size: 18px;
      letter-spacing: 0.12em;
    }
    .gen-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; }

    .result-head {
      text-align: center;
      margin-bottom: 16px;
    }
    .result-head .eyebrow { justify-content: center; margin-bottom: 8px; }
    .result-hint {
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
    }

    #result-card-img {
      width: min(100%, calc((100dvh - 220px) * 1080 / 1920));
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(20, 21, 26, 0.12);
      background: var(--sand);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .cta-save {
      height: 48px;
      border-radius: 12px;
      background: var(--strike);
      color: #fff;
      border: 2px solid var(--ink);
      font-size: 15px;
      letter-spacing: 0.12em;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .cta-save:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .cta-ghost {
      height: 48px;
      border-radius: 12px;
      border: 2px solid var(--ink);
      background: #fff;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--ink);
      box-shadow: 3px 3px 0 rgba(20, 21, 26, 0.10);
    }
    .cta-ghost:active { transform: translate(1px, 1px); }

    .result-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      line-height: 1.7;
    }


    .save-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .save-lightbox.is-on { display: flex; }
    .save-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 10, 0.86);
    }
    .save-lightbox-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(100%, 420px);
      pointer-events: none;
    }
    .save-lightbox-hint {
      pointer-events: none;
      background: rgba(255, 255, 255, 0.96);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      padding: 8px 16px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    #save-lightbox-img {
      pointer-events: auto;
      max-width: 86vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
    }
    .save-lightbox-close {
      pointer-events: auto;
      min-width: 128px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--paper);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .view, .gen-mark, .progress-fill, .cta-primary, .option { animation: none; transition: none; }
    }
    </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="save-lightbox" class="save-lightbox" aria-hidden="true">
    <div class="save-lightbox-backdrop" data-lightbox-close></div>
    <div class="save-lightbox-panel">
      <div class="save-lightbox-hint">👆 长按下方图片 → 保存到相册</div>
      <img id="save-lightbox-img" alt="结果卡" />
      <button type="button" class="save-lightbox-close" data-lightbox-close>关闭</button>
    </div>
  </div>


  <script>

  /* =============================================================================
   * QUIZ_CONFIG — 选题 3《放弃 3 个，猜你的 MBTI》
   * -----------------------------------------------------------------------------
   * 使用步骤：
   *   1. 改 meta：id / title / subtitle / lead / startLabel / homeFoot
   *   2. 改 questions：8 题为宜，每题 3–4 个 options，禁止开放式填空
   *      每个 option.scores 的 key 必须与 results[].id 一致，分值为 0–4 的整数
   *   3. 改 results：建议 4 档（不要 8 档）。每档需要：
   *        id, name, hook, tags[3], quote, summary
   *        本选题每档另带 theme.accent，结果卡会按 NT/NF/SJ/SP 四色换肤
   *   4. 改 breakdown：结果卡上的 3 根百分比条
   *        items[].from  = 直接累加的结果 id
   *        items[].share = 按 50% 均摊进来的结果 id
   *        items[].color = 条的填充色
   *   5. 改 card：结果卡眉题、印章字、页脚、文件名前缀
   *   6. （可选）改 hidden：稀有隐藏档。命中 hidden.matches 中不少于
   *        hidden.minHits 条时，优先出隐藏款，不再走普通 4 档计分。
   *        隐藏结果可自带 theme / badge / eyebrow / stamp / footer。
   *   7. 另存为新的 index.html，上传即可发布
   *
   * 计分规则：
   *   先判定隐藏款触发；未触发时，累加 8 题选项的 scores，总分最高的结果档胜出；
   *   平分时取配置里更靠前的那一档。隐藏档不要写入 option.scores，以免污染普通档。
   *   倾向百分比 = from 得分 + share 得分 × 0.5，再归一化为 100%。
   *
   * 本选题隐藏款触发（写死在 hidden.matches，供自己测 / 截图，不要发到评论区）：
   *   8 题中标定 4 个「反常规 / 悖论式」选项，至少命中 3 个即出「野生第五象限」。
   *   路径占比：C(4,3)×3×4^4 + 4^4 = 3328 / 65536 ≈ 5.08%。
   *     第 1 题 A  「计划好的时间和即兴空窗都让路，去一个谁也不约的地方。」
   *     第 3 题 C  「流程和灵感都先让路，只把最难看的那件事做完。」
   *     第 6 题 B  「行程不必钉死，也不要完全没谱，留随时能改的走法。」
   *     第 7 题 D  「不找人说，也不拆题，先把情绪放到谁也进不来的地方。」
   *   自测推荐完整路径（8 题选项）：A / D / C / B / C / B / D / A
   *   （第 2、4、5、8 题可任选；只要上面 4 条里至少中 3 条，就会出黑金隐藏卡。）
   * ============================================================================= */
  const QUIZ_CONFIG = {
    id: "give-up-three-mbti-03",
    title: "放弃 3 个，猜你的 MBTI",
    subtitle: "紫老头 / 绿老头 / 蓝老头 / 黄老头",
    chipThemes: ["nt", "nf", "sj", "sp"],
    kicker: "舍弃型人格测试  ·  03",
    lead: "不是在测你选什么。\n是在测，你先忍痛划掉什么。",
    startLabel: "开始划掉",
    homeMeta: "8 道舍弃题  ·  约 2 分钟\n结束后生成可保存的四色结果卡",
    homeFoot: "娱乐测试  ·  结果可长按保存分享",
    quizKicker: "如果必须放弃一个",
    strikeChips: [
      { text: "周末独处", dropped: true },
      { text: "吐槽的朋友", dropped: false },
      { text: "提前做计划", dropped: true },
      { text: "说走就走", dropped: false },
      { text: "把事情想透", dropped: false },
      { text: "准时赴约", dropped: true }
    ],

    card: {
      eyebrow: "测试结果",
      badge: "放弃 3 个 · 猜 MBTI",
      stamp: "弃",
      breakdownTitle: "性格倾向",
      footer: "长按保存结果卡 · 评论区报出你的老头类型",
      disclaimer: "娱乐测试 · 不是专业人格鉴定",
      filePrefix: "我的MBTI象限"
    },

    breakdown: {
      items: [
        { key: "reason",  label: "理智度", from: ["nt"], share: ["sj"], color: "#7C4DFF" },
        { key: "freedom", label: "自由度", from: ["sp"], share: ["nf"], color: "#F59E0B" },
        { key: "bound",   label: "边界感", from: ["sj"], share: ["nt"], color: "#2563EB" }
      ]
    },

    results: [
      {
        id: "nt",

  /* =========================  引擎（通常不必改）  ========================= */
  const FONT_SERIF = '"Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif';
  const FONT_SANS  = '"Noto Sans CJK SC", "Noto Sans CJK", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

  const app = document.getElementById("app");

  let toastTimer = 0;

  function showToast(msg) {
    toastEl.textContent = msg;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("is-on"), 2400);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nl2br(s) {
    return escapeHtml(s).replace(/\n/g, "<br>");
  }

  function render() {
    document.title = QUIZ_CONFIG.title;
    if (state.screen === "home") renderHome();
    else if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "generating") renderGenerating();
    else if (state.screen === "result") renderResult();
  }

  function renderHome() {
    const chips = QUIZ_CONFIG.subtitle.split("/").map((t) => t.trim()).filter(Boolean);
    app.innerHTML = `
      <section class="view is-on" id="view-home">
        <div class="home-top">
          <div class="home-eyebrow-wrap">

          </div>
          ${Array.isArray(QUIZ_CONFIG.strikeChips) && QUIZ_CONFIG.strikeChips.length ? `<div class="strike-board" aria-hidden="true">${QUIZ_CONFIG.strikeChips.map((s) => `<span class="strike-chip${s.dropped ? " is-off" : ""}">${escapeHtml(s.text)}</span>`).join("")}</div>` : ""}

        <p class="home-footer">${escapeHtml(QUIZ_CONFIG.homeFoot)}</p>
      </section>`;
    document.getElementById("btn-start").addEventListener("click", startQuiz);
  }

  function formatTitle(title) {
    const raw = String(title || "");
    if (raw.includes("MBTI")) {
      const parts = raw.split("MBTI");
      const head = escapeHtml(parts[0] || "").replace("，", "，<br>");
      const mbti = '<span class="mbti"><i class="c-nt">M</i><i class="c-nf">B</i><i class="c-sj">T</i><i class="c-sp">I</i></span>';
      return head + mbti + escapeHtml(parts[1] || "");
    }
    const t = escapeHtml(raw);
    if (t.includes("，")) {
      const segs = t.split("，");
      return segs[0] + "，<br>" + segs.slice(1).join("，");
    }
    if (t.length > 8) {
      const cut = Math.ceil(t.length / 2);
      return t.slice(0, cut) + "<br>" + t.slice(cut);
    }
    return t;
  }

  function startQuiz() {
    state.screen = "quiz";
    state.qIndex = 0;
    state.answers = [];
    state.result = null;
    state.bars = [];
    state.cardUrl = "";
    state.cardCanvas = null;
    render();

  function renderQuiz() {
    const q = QUIZ_CONFIG.questions[state.qIndex];
    const total = QUIZ_CONFIG.questions.length;
    const n = state.qIndex + 1;
    const pct = (state.qIndex / total) * 100;
    app.innerHTML = `
      <section class="view is-on" id="view-quiz">
        <div class="quiz-bar">
          <button type="button" class="back-btn" id="btn-back" ${state.qIndex === 0 ? "disabled" : ""} aria-label="上一题">

            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>

      </section>`;
    requestAnimationFrame(() => {
      const fill = app.querySelector(".progress-fill");
      if (fill) fill.style.width = (n / total) * 100 + "%";
    });
    document.getElementById("btn-back").addEventListener("click", goBack);
    app.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => pickOption(Number(btn.dataset.index), btn));
    });
  }

  function goBack() {
    if (state.qIndex === 0) return;
    state.answers.pop();
    state.qIndex -= 1;
    render();
  }

  function pickOption(index, btn) {
    if (app.dataset.locked === "1") return;
    app.dataset.locked = "1";
    btn.classList.add("is-picked");
    state.answers[state.qIndex] = index;
    const last = state.qIndex >= QUIZ_CONFIG.questions.length - 1;
    setTimeout(() => {
      app.dataset.locked = "0";
      if (last) finishQuiz();
      else {
        state.qIndex += 1;
        render();
      }
    }, 420);
  }

  function emptyScores() {
    const t = {};
    QUIZ_CONFIG.results.forEach((r) => { t[r.id] = 0; });
    return t;
  }

  function totalsFromAnswers(answers) {
    const t = emptyScores();
    answers.forEach((optIndex, qi) => {
      const opt = QUIZ_CONFIG.questions[qi].options[optIndex];
      if (!opt) return;
      Object.entries(opt.scores).forEach(([k, v]) => {
        t[k] = (t[k] || 0) + v;
      });
    });
    return t;
  }

  function hitsHidden(answers) {
    const hidden = QUIZ_CONFIG.hidden;
    if (!hidden || !hidden.matches || !hidden.matches.length) return false;
    const need = hidden.minHits == null ? hidden.matches.length : hidden.minHits;
    let hits = 0;
    hidden.matches.forEach((m) => {
      if (answers[m.q] === m.option) hits += 1;
    });
    return hits >= need;
  }

  function pickResult(totals, answers) {
    if (hitsHidden(answers) && QUIZ_CONFIG.hidden && QUIZ_CONFIG.hidden.result) {
      return QUIZ_CONFIG.hidden.result;
    }
    let best = QUIZ_CONFIG.results[0];
    let bestScore = -1;
    for (const r of QUIZ_CONFIG.results) {
      const v = totals[r.id] || 0;
      if (v > bestScore) {
        bestScore = v;
        best = r;
      }
    }
    return best;
  }

  function toPercents(values) {
    const sum = values.reduce((a, b) => a + b, 0);
    if (sum <= 0) {
      const even = Math.floor(100 / values.length);
      const arr = values.map(() => even);
      arr[0] += 100 - even * values.length;
      return arr;
    }
    const raw = values.map((v) => (v / sum) * 100);
    const floored = raw.map(Math.floor);
    let remain = 100 - floored.reduce((a, b) => a + b, 0);
    const order = raw
      .map((v, i) => ({ i, frac: v - Math.floor(v) }))
      .sort((a, b) => b.frac - a.frac);
    for (let k = 0; k < remain; k++) floored[order[k % order.length].i] += 1;
    return floored;
  }

  function computeBreakdown(totals) {
    const items = QUIZ_CONFIG.breakdown.items;
    const raw = items.map((item) => {
      let v = 0;
      (item.from || []).forEach((k) => { v += totals[k] || 0; });
      (item.share || []).forEach((k) => { v += (totals[k] || 0) * 0.5; });
      return v;
    });
    const pcts = toPercents(raw);
    return items.map((item, i) => ({
      key: item.key,
      label: item.label,
      raw: raw[i],
      pct: pcts[i],
      color: item.color
    }));
  }

  function finishQuiz() {
    const totals = totalsFromAnswers(state.answers);
    state.result = pickResult(totals, state.answers);
    state.bars = computeBreakdown(totals);
    state.screen = "generating";
    render();
    Promise.resolve()
      .then(() => ensureFonts())
      .then(() => new Promise((r) => setTimeout(r, 640)))
      .then(() => drawResultCard(state.result, state.bars))
      .then((url) => {
        state.cardUrl = url;
        state.screen = "result";
        render();
      })
      .catch((err) => {
        console.error(err);
        showToast("结果卡生成失败，请重试");
        state.screen = "home";
        render();
      });
  }

  async function saveOrShareCard() {
    const img = document.getElementById("result-card-img");
    if (!img || !img.src) return;
    const filename = `${QUIZ_CONFIG.card.filePrefix}-${state.result.name}.jpg`;
    const isInApp = /MicroMessenger|xhs|XiaoHongShu|Aweme|Douyin|QQ\/|Weibo/i.test(navigator.userAgent);
    const isIOS = /iP(hone|ad|od)/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isInApp || isIOS) {
      openSaveLightbox(img.src);
      return;
    }

    try {
      const canvas = state.cardCanvas;
      let blob;
      if (canvas && typeof canvas.toBlob === "function") {
        blob = await new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob failed"))), "image/jpeg", state.cardJpegQuality || 0.90);
        });
      } else {
        blob = await (await fetch(img.src)).blob();
      }
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      showToast("已开始下载到手机相册/下载目录");
    } catch (err) {
      openSaveLightbox(img.src);
    }
  }

  function openSaveLightbox(src) {

  function closeSaveLightbox() {
    const box = document.getElementById("save-lightbox");
    const shot = document.getElementById("save-lightbox-img");
    if (!box) return;
    box.classList.remove("is-on");
    box.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (shot) shot.removeAttribute("src");
  }

  function bindSaveLightbox() {
    const box = document.getElementById("save-lightbox");
    if (!box || box.dataset.bound === "1") return;
    box.dataset.bound = "1";
    box.addEventListener("click", (e) => {
      if (e.target && e.target.hasAttribute("data-lightbox-close")) closeSaveLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && box.classList.contains("is-on")) closeSaveLightbox();
    });
  }
  bindSaveLightbox();
  async function ensureFonts() {
    if (!document.fonts) return;
    try { await document.fonts.ready; } catch (e) {}
    const faces = [
      `700 112px ${FONT_SERIF}`,
      `400 42px ${FONT_SERIF}`,
      `700 42px ${FONT_SERIF}`,
      `400 28px ${FONT_SANS}`,
      `500 28px ${FONT_SANS}`,
      `700 30px ${FONT_SANS}`
    ];
    await Promise.all(faces.map((f) => document.fonts.load(f).catch(() => null)));
  }

  function wrapText(ctx, text, maxWidth) {
    const noStart = "。，、；：！？）》」』…";
    const preferred = "。！？；，、 ";
    const out = [];

    function fixOrphans(block) {
      if (block.length < 2) return block;
      const minLast = 5;
      const last = [...block[block.length - 1]];
      if (last.length >= minLast) return block;
      const prev = [...block[block.length - 2]];
      while (last.length < minLast && prev.length > minLast + 1) {
        last.unshift(prev.pop());
      }
      block[block.length - 2] = prev.join("");
      block[block.length - 1] = last.join("");
      return block;
    }

    for (const paragraph of String(text || "").split("\n")) {
      const chars = [...paragraph];
      if (!chars.length) { out.push(""); continue; }
      const para = [];
      let line = "";
      let breakAt = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const test = line + ch;
        const overflow = !!(line && ctx.measureText(test).width > maxWidth && !noStart.includes(ch));
        if (overflow) {
          const arr = [...line];
          if (breakAt >= 4 && breakAt < arr.length) {
            para.push(arr.slice(0, breakAt).join(""));
            line = arr.slice(breakAt).join("");
            breakAt = -1;
            i -= 1;
            continue;
          }
          para.push(line);
          line = "";
          breakAt = -1;
          i -= 1;
          continue;
        }
        line = test;
        if (preferred.includes(ch)) breakAt = [...line].length;
      }
      if (line) para.push(line);
      out.push.apply(out, fixOrphans(para));
    }
    return out;
  }

  function roundedRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function getCardPalette(result) {
    const theme = (result && result.theme) || {};
    const dark = theme.id === "black-gold" || theme.mode === "dark";
    if (dark) {
      const gold = theme.gold || "#E5C168";
      const ivory = theme.ivory || "#F4F1EA";
      const bg = theme.bg || "#121318";
      return {
        bg: bg,
        wash: "rgba(229,193,104,0.14)",
        ink: ivory,
        accent: gold,
        track: "rgba(229,193,104,0.18)",
        faint: "rgba(244,241,234,0.48)",
        hook: "rgba(244,241,234,0.78)",
        summary: "rgba(244,241,234,0.70)",
        frame: "rgba(229,193,104,0.70)",
        frameInner: "rgba(229,193,104,0.30)",
        divider: "rgba(229,193,104,0.28)",
        tagStroke: "rgba(229,193,104,0.70)",
        badgeBg: gold,
        badgeText: bg,
        grainA: "#000000",
        grainB: "#E5C168",
        grainAlpha: 0.06,
        holo: true
      };
    }
    const accent = theme.accent || "#7C4DFF";
    const badgeText = theme.badgeText || "#FFFFFF";
    const wash = theme.wash || "rgba(124,77,255,0.12)";
    return {
      bg: "#F7F8FA",
      wash: wash,
      ink: "#14151A",
      accent: accent,
      track: "rgba(20,21,26,0.08)",
      faint: "rgba(20,21,26,0.48)",
      hook: "rgba(20,21,26,0.72)",
      summary: "rgba(20,21,26,0.62)",
      frame: accent,
      frameInner: "rgba(20,21,26,0.16)",
      divider: "rgba(20,21,26,0.14)",
      tagStroke: "rgba(20,21,26,0.22)",
      badgeBg: accent,
      badgeText: badgeText,
      grainA: "#14151A",
      grainB: "#FFFFFF",
      grainAlpha: 0.04,
      holo: false
    };
  }


  function approxDataUrlBytes(url) {
    const i = String(url).indexOf(",");
    const b64 = i >= 0 ? String(url).slice(i + 1) : String(url);
    let pad = 0;
    if (b64.endsWith("==")) pad = 2;
    else if (b64.endsWith("=")) pad = 1;
    return Math.floor(b64.length * 3 / 4) - pad;
  }

  function exportCardImage(canvas) {
    const qualities = [0.90, 0.86, 0.82, 0.78, 0.74];
    const maxBytes = 160 * 1024;
    let chosenQ = qualities[qualities.length - 1];
    let url = canvas.toDataURL("image/jpeg", chosenQ);
    for (const q of qualities) {
      const candidate = canvas.toDataURL("image/jpeg", q);
      chosenQ = q;
      url = candidate;
      if (approxDataUrlBytes(candidate) <= maxBytes) break;
    }
    state.cardCanvas = canvas;
    state.cardJpegQuality = chosenQ;
    return url;
  }

  function drawResultCard(result, bars) {
    const W = 1080;
    const H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const MX = 128;
    const contentW = W - MX * 2;
    const pal = getCardPalette(result);
    const ink = pal.ink;
    const rose = pal.accent;
    const sand = pal.track;
    const cream = pal.bg;
    const faint = pal.faint;

    // background
    ctx.fillStyle = cream;
    ctx.fillRect(0, 0, W, H);
    const wash = ctx.createLinearGradient(0, 0, 0, 640);
    wash.addColorStop(0, pal.wash);
    wash.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, 640);

    if (pal.holo) {
      const corners = [
        { c: "rgba(124,77,255,0.20)", x: 0, y: 0 },
        { c: "rgba(16,185,129,0.14)", x: W, y: 0 },
        { c: "rgba(37,99,235,0.14)", x: 0, y: H },
        { c: "rgba(245,158,11,0.16)", x: W, y: H }
      ];
      corners.forEach((spot) => {
        const g = ctx.createRadialGradient(spot.x, spot.y, 80, spot.x, spot.y, 480);
        g.addColorStop(0, spot.c);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      });
      const sheen = ctx.createLinearGradient(0, 160, W, 760);
      sheen.addColorStop(0, "rgba(229,193,104,0)");
      sheen.addColorStop(0.45, "rgba(229,193,104,0.10)");
      sheen.addColorStop(0.55, "rgba(124,77,255,0.08)");
      sheen.addColorStop(1, "rgba(229,193,104,0)");
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, W, H);
    }

    // subtle grain under the type (keeps glyphs crisp)
    ctx.save();
    ctx.globalAlpha = pal.grainAlpha;
    const grains = pal.holo ? 5000 : 9000;
    for (let i = 0; i < grains; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? pal.grainA : pal.grainB;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
    }
    ctx.restore();

    // temperament watermark, scannable in comment screenshots
    if (result.mark) {
      ctx.save();
      ctx.globalAlpha = pal.holo ? 0.13 : 0.10;
      ctx.fillStyle = rose;
      ctx.font = `700 260px ${FONT_SANS}`;
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.fillText(result.mark, W - 72, 210);
      ctx.restore();
    }

    // double frame + bold accent outer rule (neo-brutalist / camp color)
    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = pal.holo ? 3 : 6;
    ctx.strokeRect(48, 48, W - 96, H - 96);
    ctx.strokeStyle = pal.frameInner;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(64, 64, W - 128, H - 128);

    // stamp
    const stamp = result.stamp || QUIZ_CONFIG.card.stamp || "招";
    const sx = W - 168;
    const sy = 168;
    ctx.beginPath();
    ctx.arc(sx, sy, 52, 0, Math.PI * 2);
    ctx.strokeStyle = rose;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, 44, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = rose;
    ctx.font = `700 40px ${FONT_SERIF}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(stamp, sx, sy + 2);

    let y = 150;

    // eyebrow
    ctx.fillStyle = faint;
    ctx.font = `400 22px ${FONT_SANS}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.letterSpacing = "8px";
    try { ctx.letterSpacing = "0.22em"; } catch (e) {}
    ctx.fillText(result.eyebrow || QUIZ_CONFIG.card.eyebrow, MX, y);
    ctx.letterSpacing = "0px";

    // badge
    y = 210;
    const badge = result.badge || QUIZ_CONFIG.card.badge;
    ctx.font = `500 22px ${FONT_SANS}`;
    const badgeW = ctx.measureText(badge).width + 48;
    const badgeH = 44;
    const badgeX = MX;
    roundedRect(ctx, badgeX, y, badgeW, badgeH, 22);
    ctx.fillStyle = pal.badgeBg;
    ctx.fill();
    ctx.fillStyle = pal.badgeText;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(badge, badgeX + 24, y + badgeH / 2 + 1);

    // title
    y = 430;
    ctx.fillStyle = ink;
    ctx.font = `700 108px ${FONT_SERIF}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const titleLines = wrapText(ctx, result.name, contentW);
    const titleSize = titleLines.length > 1 ? 84 : 108;
    ctx.font = `700 ${titleSize}px ${FONT_SERIF}`;
    const titleLines2 = wrapText(ctx, result.name, contentW);
    const titleLh = titleSize + 16;
    titleLines2.forEach((line, i) => {
      ctx.fillText(line, MX, y + i * titleLh);
    });
    y += titleLines2.length * titleLh + 28;

    // hook
    ctx.fillStyle = pal.hook;
    ctx.font = `400 30px ${FONT_SANS}`;
    const hookLines = wrapText(ctx, result.hook, contentW);
    hookLines.forEach((line) => {
      ctx.fillText(line, MX, y);
      y += 48;
    });
    y += 28;

    // tags
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.textBaseline = "middle";
    let tagX = MX;
    const tagY = y;
    const tagH = 52;
    (result.tags || []).slice(0, 3).forEach((tag) => {
      const tw = ctx.measureText(tag).width + 40;
      roundedRect(ctx, tagX, tagY, tw, tagH, 26);
      ctx.strokeStyle = pal.tagStroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = ink;
      ctx.textAlign = "center";
      ctx.fillText(tag, tagX + tw / 2, tagY + tagH / 2 + 1);
      tagX += tw + 16;
      ctx.textAlign = "left";
    });
    y = tagY + tagH + 70;

    // quote
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textBaseline = "alphabetic";
    ctx.fillText("「", MX - 8, y);
    y += 18;
    ctx.fillStyle = ink;
    ctx.font = `400 40px ${FONT_SERIF}`;
    const quote = String(result.quote || "").replace(/^[「『]/, "").replace(/[」』]$/, "");
    const quoteLines = wrapText(ctx, quote, contentW - 20);
    quoteLines.forEach((line) => {
      ctx.fillText(line, MX + 8, y);
      y += 66;
    });
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textAlign = "right";
    ctx.fillText("」", W - MX + 8, y + 8);
    ctx.textAlign = "left";
    y += 56;

    // divider
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, y);
    ctx.lineTo(W - MX, y);
    ctx.stroke();
    y += 70;

    // breakdown title
    ctx.fillStyle = faint;
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.fillText(QUIZ_CONFIG.card.breakdownTitle, MX, y);
    y += 54;

    // bars — reserve footer space so nothing collides
    const footerTop = 1728;
    const barCount = Math.max(bars.length, 1);
    const barBlock = Math.min(140, Math.max(110, (footerTop - 40 - y) / barCount));
    bars.forEach((bar) => {
      ctx.fillStyle = ink;
      ctx.font = `500 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(bar.label, MX, y);
      ctx.textAlign = "right";
      ctx.fillText(bar.pct + "%", W - MX, y);
      ctx.textAlign = "left";

      const trackY = y + 24;
      const trackH = 16;
      roundedRect(ctx, MX, trackY, contentW, trackH, 8);
      ctx.fillStyle = sand;
      ctx.fill();
      const fillW = Math.max(bar.pct > 0 ? 16 : 0, Math.round(contentW * (bar.pct / 100)));
      if (fillW > 0) {
        roundedRect(ctx, MX, trackY, fillW, trackH, 8);
        ctx.fillStyle = bar.color || rose;
        ctx.fill();
      }
      y += barBlock;
    });

    // summary, if it still fits above the pinned footer
    const fy = 1764;
    if (result.summary) {
      ctx.fillStyle = pal.summary;
      ctx.font = `400 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const sumLines = wrapText(ctx, result.summary, contentW);
      const sumLh = 48;
      const sumBlock = sumLines.length * sumLh;
      let sy = y + 12;
      if (sy + sumBlock > fy - 36) {
        sy = Math.max(y, fy - 36 - sumBlock);
      }
      if (sy + sumBlock <= fy - 24) {
        sumLines.forEach((line, i) => {
          ctx.fillText(line, MX, sy + i * sumLh);
        });
      }
    }

    // footer pinned
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, fy);
    ctx.lineTo(W - MX, fy);
    ctx.stroke();

    ctx.fillStyle = ink;
    ctx.font = `400 24px ${FONT_SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(result.footer || QUIZ_CONFIG.card.footer, W / 2, fy + 50);
    ctx.fillStyle = faint;
    ctx.font = `400 20px ${FONT_SANS}`;
    ctx.fillText(result.disclaimer || QUIZ_CONFIG.card.disclaimer, W / 2, fy + 90);

    return exportCardImage(canvas);
  }

  render();
  </script>
</body>
