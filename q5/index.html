<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F9FA" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="第一眼看到什么字，暴露你的隐藏性格。7 道直觉题，生成可保存的美术馆性格诊断签。" />
  <title>第一眼看到什么字？</title>
  <style>
    :root {
      --gallery: #F8F9FA;
      --paper: #FFFFFF;
      --ink: #111111;
      --ink-soft: #4A4E57;
      --ink-faint: #8A8F98;
      --blue: #1D4ED8;
      --blue-deep: #163DB0;
      --blue-soft: rgba(29, 78, 216, 0.10);
      --line: rgba(17, 17, 17, 0.14);
      --hair: rgba(17, 17, 17, 0.08);
      --grid: rgba(17, 17, 17, 0.045);
      --track: #E6E8EB;
      --obsidian: #0F1012;
      --gold: #E0BC75;
      --gold-soft: rgba(224, 188, 117, 0.45);
      --shadow: 0 8px 28px rgba(17, 17, 17, 0.05);
      --font-serif: "Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --font-sans: "Noto Sans CJK SC", "Noto Sans CJK", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 2px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--gallery);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }
    button {
      font-family: inherit;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    img { display: block; max-width: 100%; }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      background-color: var(--gallery);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    .view {
      display: none;
      min-height: 100dvh;
      padding: calc(24px + var(--safe-top)) 22px calc(28px + var(--safe-bottom));
      animation: rise 0.4s ease both;
    }
    .view.is-on { display: flex; flex-direction: column; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .home-catalog {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ink-faint);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ink);
      margin-bottom: 28px;
    }
    .home-catalog .no {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .home-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(36px, 11vw, 46px);
      line-height: 1.16;
      letter-spacing: 0.02em;
      text-align: left;
      font-feature-settings: "kern";
    }
    .home-title em {
      font-style: normal;
      color: var(--blue);
      font-size: 1.12em;
    }

    .home-tagline {
      margin-top: 14px;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: var(--ink);
      font-weight: 500;
    }

    .chips {
      display: flex;
      gap: 8px;
      margin: 28px 0 0;
      flex-wrap: wrap;
    }
    .chip {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.12em;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
    }

    .home-lead {
      text-align: left;
      font-size: 14px;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 22em;
      margin: 28px 0 36px;
    }

    .cta-primary {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--gallery);
      border-radius: var(--radius);
      height: 52px;
      font-size: 15px;
      letter-spacing: 0.22em;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .cta-primary:active { transform: scale(0.985); background: #000; }

    .home-meta {
      text-align: left;
      margin-top: 16px;
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.7;
      letter-spacing: 0.06em;
    }

    .home-footer {
      margin-top: auto;
      padding-top: 36px;
      text-align: left;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      border-top: 1px solid var(--hair);
    }

    .quiz-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      flex: 0 0 36px;
      background: var(--paper);
      transition: background 0.15s ease;
    }
    .back-btn:disabled { opacity: 0.3; }
    .back-btn:not(:disabled):active { background: var(--track); }
    .progress-wrap { flex: 1; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 2px;
      background: var(--track);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--blue);
      transition: width 0.35s ease;
    }

    .q-kicker {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--blue);
    }
    .q-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      margin: 8px 0 18px;
    }
    .view:has(.q-print) .q-title {
      font-size: 19px;
      margin: 10px 0 12px;
    }

    .q-print {
      margin: 8px 0 4px;
      width: 100%;
      max-height: 232px;
      display: flex;
      justify-content: center;
      background: var(--paper);
      border: 1px solid var(--ink);
      box-shadow: var(--shadow);
    }
    .q-print svg {
      height: 232px;
      width: auto;
      max-width: 100%;
      display: block;
    }
    .q-caption {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      margin: 8px 0 0;
    }

    .options { display: flex; flex-direction: column; gap: 8px; }
    .option {
      text-align: left;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    .option:active { transform: scale(0.985); }
    .option.is-picked {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--gallery);
    }
    .opt-key {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      font-size: 11px;
      letter-spacing: 0;
      color: var(--ink);
      background: var(--track);
      margin-top: 1px;
      font-weight: 500;
    }
    .option.is-picked .opt-key {
      background: var(--blue);
      color: #fff;
    }
    .opt-text {
      font-size: 15px;
      line-height: 1.6;
      color: inherit;
      padding-top: 1px;
    }

    .options.glyph-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .options.glyph-grid .option {
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      min-height: 78px;
      padding: 10px 12px 12px;
      gap: 2px;
    }
    .options.glyph-grid .opt-key {
      width: 18px;
      height: 18px;
      font-size: 9px;
      margin: 0 0 2px;
    }
    .options.glyph-grid .opt-text {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 4px 0 0;
    }

    .gen-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      gap: 16px;
    }
    .gen-mark {
      width: 18px;
      height: 18px;
      border: 1px solid var(--blue);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }
    .gen-text {
      font-family: var(--font-serif);
      font-size: 20px;
      letter-spacing: 0.08em;
    }
    .gen-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.12em; }

    .result-head { margin-bottom: 14px; }
    .result-kicker {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ink);
      margin-bottom: 8px;
    }
    .result-kicker strong {
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-serif);
      letter-spacing: 0.12em;
      font-size: 13px;
    }
    .result-hint {
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
    }

    #result-card-img {
      width: min(100%, calc((100dvh - 220px) * 1080 / 1920));
      height: auto;
      margin: 0 auto;
      border-radius: 0;
      box-shadow: 0 16px 50px rgba(17, 17, 17, 0.10);
      background: var(--track);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
      border: 1px solid var(--line);
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    .cta-save {
      height: 48px;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.16em;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .cta-save:active { transform: scale(0.98); background: var(--blue-deep); }
    .cta-ghost {
      height: 48px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 14px;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
    }
    .cta-ghost:active { background: var(--track); }

    .result-note {
      margin-top: 12px;
      text-align: left;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      line-height: 1.7;
    }


    .save-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .save-lightbox.is-on { display: flex; }
    .save-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 10, 0.86);
    }
    .save-lightbox-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(100%, 420px);
      pointer-events: none;
    }
    .save-lightbox-hint {
      pointer-events: none;
      background: rgba(255, 255, 255, 0.96);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      padding: 8px 16px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    #save-lightbox-img {
      pointer-events: auto;
      max-width: 86vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
    }
    .save-lightbox-close {
      pointer-events: auto;
      min-width: 128px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--gallery);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: var(--radius);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .view, .gen-mark, .progress-fill, .cta-primary, .option { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="save-lightbox" class="save-lightbox" aria-hidden="true">
    <div class="save-lightbox-backdrop" data-lightbox-close></div>
    <div class="save-lightbox-panel">
      <div class="save-lightbox-hint">👆 长按下方图片 → 保存到相册</div>
      <img id="save-lightbox-img" alt="结果卡" />
      <button type="button" class="save-lightbox-close" data-lightbox-close>关闭</button>
    </div>
  </div>


  <script>
  /* =============================================================================
   * QUIZ_CONFIG — 选题 7《第一眼看到什么字，暴露你的隐藏性格》
   * -----------------------------------------------------------------------------
   * 使用步骤：
   *   1. 改 meta：id / title / tagline / lead / startLabel / homeFoot
   *   2. 改 questions：本题 7 题，每题 4 个 options，禁止开放式填空
   *      第 1 题可设 visual: "optical-field"、layout: "glyphs"
   *      每个 option.scores 的 key 必须与 results[].id 一致，分值为 0–4 的整数
   *   3. 改 results：建议 4 档。每档需要：
   *        id, name, hook, tags[3], quote, summary；可选 nameLines / watermark / stamp
   *   4. 改 breakdown：结果卡上的 3 根百分比条
   *        items[].from  = 直接累加的结果 id
   *        items[].share = 按 50% 均摊进来的结果 id
   *   5. 改 card：结果卡眉题、印章字、页脚、文件名前缀
   *   6. （可选）改 hidden：稀有隐藏档。命中 hidden.matches 中不少于
   *        hidden.minHits 条时，优先出隐藏款，不再走普通 4 档计分。
   *
   * 计分规则：
   *   先判定隐藏款触发；未触发时，累加选项的 scores，总分最高的结果档胜出；
   *   平分时取配置里更靠前的那一档。隐藏档不要写入 option.scores，以免污染普通档。
   *   维度百分比 = from 得分 + share 得分 × 0.5，再归一化为 100%。
   *
   * 本选题隐藏款触发（写死在 hidden.matches，供自己测 / 截图，不要发到评论区）：
   *   7 题中标定 4 个「高反差 / 难被读懂」选项，至少命中 3 个即出「极昼反差人格」。
   *   路径占比：C(4,3)×3×4^3 + 4^3 = 832 / 16384 ≈ 5.08%。
   *     第 2 题 D  「哪面墙最适合被改掉。」
   *     第 3 题 D  「越被定义，越想当场翻盘。」
   *     第 5 题 B  「心里先把话拆开：是关心，还是评价。」
   *     第 7 题 D  「以为你稳定，其实你随时能掀桌重来。」
   *   自测推荐完整路径（7 题选项）：C / D / D / C / B / C / D
   * ============================================================================= */
  const QUIZ_CONFIG = {
    id: "first-glance-char-07",
    title: "第一眼看到什么字？",
    tagline: "暴露你的隐藏性格",
    subtitle: "光 / 逃 / 稳 / 赢",
    kicker: "视觉人格诊断",
    catalogNo: "07",
    lead: "不要分析，不要犹豫。\n第一眼看见的那个字，会露出你藏起来的性格。",
    startLabel: "看第一眼",
    homeMeta: "7 道直觉题  ·  约 1 分钟\n结束后生成可保存的诊断签",
    homeFoot: "娱乐测试  ·  结果可长按保存分享",
    quizKicker: "直觉选择",

    card: {
      eyebrow: "视觉人格档案",
      badge: "性格诊断签",
      stamp: "视",
      breakdownTitle: "三维读数",
      footer: "长按保存诊断签 · 评论区报出你的类型",
      disclaimer: "娱乐测试 · 结果仅供自娱和分享",
      filePrefix: "第一眼看到什么字"
    },

    breakdown: {
      items: [
        { key: "intuition", label: "直觉敏锐度", from: ["tao"], share: ["ying"] },
        { key: "stability", label: "内核稳定度", from: ["wen"], share: ["guang"] },
        { key: "contrast",  label: "隐藏反差值", from: ["ying", "guang"], share: ["tao"] }
      ]
    },

    results: [
      {
        id: "guang",
        name: "外冷内热蓄光体",
        nameLines: ["外冷内热", "蓄光体"],
        watermark: "光",
        stamp: "光",
        hook: "表面克制独立，骨子里藏着极强的野心与温度。",
        tags: ["克制独立", "内里有光", "野心藏得深"],
        quote: "光不是拿来炫耀的。是我自己慢慢攒起来的。",
        summary: "别人先看见你的距离感，很少第一眼看见你的热。你把能量蓄在里面，关键时刻才会亮出来。"
      },
      {
        id: "tao",
        name: "高敏直觉雷达",
        nameLines: ["高敏直觉", "雷达"],
        watermark: "逃",
        stamp: "逃",
        hook: "一眼看穿人心，看似佛系其实边界拉满。",
        tags: ["一眼看穿", "高敏直觉", "边界拉满"],
        quote: "我看起来不在意。其实第一眼，我就已经看见了。",
        summary: "你对气氛、语气和缝隙极度敏感。不是想逃开所有人，是先保护自己，再决定要不要靠近。"
      },
      {
        id: "wen",
        name: "慢热稳赢派",
        nameLines: ["慢热稳赢派"],
        watermark: "稳",
        stamp: "稳",
        hook: "不抢风头，但关键节点从不掉链子。",
        tags: ["不抢风头", "慢热沉住", "关键不掉链"],
        quote: "风头可以让。结果，我会自己拿到。",
        summary: "你不急着证明自己。节奏在你手里，热闹可以让出去，真正要赢的那一步，你很少失手。"
      },
      {
        id: "ying",
        name: "清醒破局者",
        nameLines: ["清醒破局者"],
        watermark: "赢",
        stamp: "赢",
        hook: "讨厌被定义，越被限制越想换赛道翻盘。",
        tags: ["讨厌被定义", "换赛道", "清醒翻盘"],
        quote: "别急着定义我。定义得越死，我越想走出这格。",
        summary: "你看得到现有框架的边界，也耐受不了被框死。不是为了叛逆，是为了给自己留一条能赢的路。"
      }
    ],

    /* -----------------------------------------------------------------
     * hidden — 稀有隐藏档「极昼反差人格」

     *   下列 4 个选项代表同一类「理性与锋芒并存、难被一次读懂」的选择。

  function pickOption(index, btn) {
    if (app.dataset.locked === "1") return;

  function emptyScores() {
    const t = {};
    QUIZ_CONFIG.results.forEach((r) => { t[r.id] = 0; });
    return t;
  }

  function totalsFromAnswers(answers) {
    const t = emptyScores();
    answers.forEach((optIndex, qi) => {
      const opt = QUIZ_CONFIG.questions[qi].options[optIndex];
      if (!opt) return;
      Object.entries(opt.scores).forEach(([k, v]) => {
        t[k] = (t[k] || 0) + v;
      });
    });
    return t;
  }

  function hitsHidden(answers) {
    const hidden = QUIZ_CONFIG.hidden;
    if (!hidden || !hidden.matches || !hidden.matches.length) return false;
    const need = hidden.minHits == null ? hidden.matches.length : hidden.minHits;
    let hits = 0;
    hidden.matches.forEach((m) => {
      if (answers[m.q] === m.option) hits += 1;
    });
    return hits >= need;
  }

  function pickResult(totals, answers) {
    if (hitsHidden(answers) && QUIZ_CONFIG.hidden && QUIZ_CONFIG.hidden.result) {
      return QUIZ_CONFIG.hidden.result;
    }
    let best = QUIZ_CONFIG.results[0];
    let bestScore = -1;
    for (const r of QUIZ_CONFIG.results) {
      const v = totals[r.id] || 0;
      if (v > bestScore) {
        bestScore = v;
        best = r;
      }
    }
    return best;
  }

  function toPercents(values) {
    const sum = values.reduce((a, b) => a + b, 0);
    if (sum <= 0) {
      const even = Math.floor(100 / values.length);
      const arr = values.map(() => even);
      arr[0] += 100 - even * values.length;
      return arr;
    }
    const raw = values.map((v) => (v / sum) * 100);
    const floored = raw.map(Math.floor);
    let remain = 100 - floored.reduce((a, b) => a + b, 0);
    const order = raw
      .map((v, i) => ({ i, frac: v - Math.floor(v) }))
      .sort((a, b) => b.frac - a.frac);
    for (let k = 0; k < remain; k++) floored[order[k % order.length].i] += 1;
    return floored;
  }

  function computeBreakdown(totals) {
    const items = QUIZ_CONFIG.breakdown.items;
    const raw = items.map((item) => {
      let v = 0;
      (item.from || []).forEach((k) => { v += totals[k] || 0; });
      (item.share || []).forEach((k) => { v += (totals[k] || 0) * 0.5; });
      return v;
    });
    const pcts = toPercents(raw);
    return items.map((item, i) => ({
      key: item.key,
      label: item.label,
      raw: raw[i],
      pct: pcts[i]
    }));
  }

  function finishQuiz() {
    const totals = totalsFromAnswers(state.answers);
    state.result = pickResult(totals, state.answers);
    state.bars = computeBreakdown(totals);

    Promise.resolve()
      .then(() => ensureFonts())

        state.cardUrl = drawResultCard(state.result, state.bars);

        render();

        state.screen = "result";

  async function saveOrShareCard() {
    const img = document.getElementById("result-card-img");
    if (!img || !img.src) return;
    const filename = `${QUIZ_CONFIG.card.filePrefix}-${state.result.name}.jpg`;
    const isInApp = /MicroMessenger|xhs|XiaoHongShu|Aweme|Douyin|QQ\/|Weibo/i.test(navigator.userAgent);
    const isIOS = /iP(hone|ad|od)/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isInApp || isIOS) {
      openSaveLightbox(img.src);
      return;
    }

    try {
      const canvas = state.cardCanvas;
      let blob;
      if (canvas && typeof canvas.toBlob === "function") {
        blob = await new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob failed"))), "image/jpeg", state.cardJpegQuality || 0.90);
        });
      } else {
        blob = await (await fetch(img.src)).blob();
      }
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      showToast("已开始下载到手机相册/下载目录");
    } catch (err) {
      openSaveLightbox(img.src);
    }
  }

  function bindSaveLightbox() {
    const box = document.getElementById("save-lightbox");

    box.dataset.bound = "1";
    box.addEventListener("click", (e) => {
      if (e.target && e.target.hasAttribute("data-lightbox-close")) closeSaveLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && box.classList.contains("is-on")) closeSaveLightbox();
    });
  }
  bindSaveLightbox();
  async function ensureFonts() {
    if (!document.fonts) return;
    try { await document.fonts.ready; } catch (e) {}
    const faces = [
      `700 112px ${FONT_SERIF}`,
      `700 520px ${FONT_SERIF}`,
      `400 42px ${FONT_SERIF}`,
      `700 42px ${FONT_SERIF}`,
      `400 28px ${FONT_SANS}`,
      `500 28px ${FONT_SANS}`,
      `700 30px ${FONT_SANS}`
    ];
    await Promise.all(faces.map((f) => document.fonts.load(f).catch(() => null)));
  }

  function wrapText(ctx, text, maxWidth) {
    const noStart = "。，、；：！？）》」』…";
    const preferred = "。！？；，、 ";
    const out = [];

    function fixOrphans(block) {
      if (block.length < 2) return block;
      const minLast = 5;
      const last = [...block[block.length - 1]];
      if (last.length >= minLast) return block;
      const prev = [...block[block.length - 2]];
      while (last.length < minLast && prev.length > minLast + 1) {
        last.unshift(prev.pop());
      }
      block[block.length - 2] = prev.join("");
      block[block.length - 1] = last.join("");
      return block;
    }

    for (const paragraph of String(text || "").split("\n")) {
      const chars = [...paragraph];
      if (!chars.length) { out.push(""); continue; }
      const para = [];
      let line = "";
      let breakAt = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const test = line + ch;
        const overflow = !!(line && ctx.measureText(test).width > maxWidth && !noStart.includes(ch));
        if (overflow) {
          const arr = [...line];
          if (breakAt >= 4 && breakAt < arr.length) {
            para.push(arr.slice(0, breakAt).join(""));
            line = arr.slice(breakAt).join("");
            breakAt = -1;
            i -= 1;
            continue;
          }
          para.push(line);
          line = "";
          breakAt = -1;
          i -= 1;
          continue;
        }
        line = test;
        if (preferred.includes(ch)) breakAt = [...line].length;
      }
      if (line) para.push(line);
      out.push.apply(out, fixOrphans(para));
    }
    return out;
  }

  function roundedRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function getCardPalette(result) {
    const theme = (result && result.theme) || {};
    const dark = theme.id === "black-gold" || theme.mode === "dark";
    if (dark) {
      const gold = theme.gold || "#E0BC75";
      const ivory = theme.ivory || "#F3EBDA";
      const bg = theme.bg || "#0F1012";
      return {
        bg: bg,
        wash: "rgba(224,188,117,0.08)",
        ink: ivory,
        accent: gold,
        track: "rgba(224,188,117,0.16)",
        faint: "rgba(243,235,218,0.48)",
        hook: "rgba(243,235,218,0.78)",
        summary: "rgba(243,235,218,0.70)",
        frame: "rgba(224,188,117,0.70)",
        frameInner: "rgba(224,188,117,0.28)",
        divider: "rgba(224,188,117,0.28)",
        tagStroke: "rgba(224,188,117,0.70)",
        badgeBg: gold,
        badgeText: bg,
        grainA: "#000000",
        grainB: "#E0BC75",
        grainAlpha: 0.045,
        watermark: gold,
        watermarkAlpha: 0.10,
        rule: gold,
        crop: gold,
        gridLine: "rgba(224,188,117,0.07)"
      };
    }
    return {
      bg: "#F8F9FA",
      wash: "rgba(29,78,216,0.05)",
      ink: "#111111",
      accent: "#1D4ED8",
      track: "#E6E8EB",
      faint: "rgba(17,17,17,0.45)",
      hook: "rgba(17,17,17,0.72)",
      summary: "rgba(17,17,17,0.62)",
      frame: "rgba(17,17,17,0.88)",
      frameInner: "rgba(17,17,17,0.16)",
      divider: "rgba(17,17,17,0.16)",
      tagStroke: "rgba(17,17,17,0.28)",
      badgeBg: "#111111",
      badgeText: "#F8F9FA",
      grainA: "#111111",
      grainB: "#FFFFFF",
      grainAlpha: 0.03,
      watermark: "#111111",
      watermarkAlpha: 0.06,
      rule: "#1D4ED8",
      crop: "#111111",
      gridLine: "rgba(17,17,17,0.045)"
    };
  }

  function drawCropMarks(ctx, W, H, pal) {
    const m = 28;
    const len = 22;
    ctx.strokeStyle = pal.crop;
    ctx.lineWidth = 1;
    const marks = [
      [m, 48, m, 48 - len, 48, m, 48 - len, m],
      [W - m, 48, W - m, 48 - len, W - 48, m, W - 48 + len, m],
      [m, H - 48, m, H - 48 + len, 48, H - m, 48 - len, H - m],
      [W - m, H - 48, W - m, H - 48 + len, W - 48, H - m, W - 48 + len, H - m]
    ];
    marks.forEach((a) => {
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(a[2], a[3]);
      ctx.moveTo(a[4], a[5]);
      ctx.lineTo(a[6], a[7]);
      ctx.stroke();
    });
  }


  function approxDataUrlBytes(url) {
    const i = String(url).indexOf(",");
    const b64 = i >= 0 ? String(url).slice(i + 1) : String(url);
    let pad = 0;
    if (b64.endsWith("==")) pad = 2;
    else if (b64.endsWith("=")) pad = 1;
    return Math.floor(b64.length * 3 / 4) - pad;
  }

  function exportCardImage(canvas) {
    const qualities = [0.90, 0.86, 0.82, 0.78, 0.74];
    const maxBytes = 160 * 1024;
    let chosenQ = qualities[qualities.length - 1];
    let url = canvas.toDataURL("image/jpeg", chosenQ);
    for (const q of qualities) {
      const candidate = canvas.toDataURL("image/jpeg", q);
      chosenQ = q;
      url = candidate;
      if (approxDataUrlBytes(candidate) <= maxBytes) break;
    }
    state.cardCanvas = canvas;
    state.cardJpegQuality = chosenQ;
    return url;
  }

  function drawResultCard(result, bars) {
    const W = 1080;
    const H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const MX = 128;
    const contentW = W - MX * 2;
    const pal = getCardPalette(result);
    const ink = pal.ink;
    const accent = pal.accent;
    const sand = pal.track;
    const faint = pal.faint;

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);

    // faint modular grid
    ctx.save();
    ctx.strokeStyle = pal.gridLine;
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= W; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (let gy = 0; gy <= H; gy += 40) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    ctx.restore();

    const wash = ctx.createLinearGradient(0, 0, 0, 720);
    wash.addColorStop(0, pal.wash);
    wash.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, 720);

    ctx.save();
    ctx.globalAlpha = pal.grainAlpha;
    for (let i = 0; i < 12000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? pal.grainA : pal.grainB;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.1, 1.1);
    }
    ctx.restore();

    // big focal character watermark
    const mark = result.watermark || result.stamp || "";
    if (mark) {
      ctx.save();
      ctx.globalAlpha = pal.watermarkAlpha;
      ctx.fillStyle = pal.watermark;
      ctx.font = `700 580px ${FONT_SERIF}`;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(mark, W - 70, 430);
      ctx.restore();
    }

    // hairline frame
    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, W - 96, H - 96);
    ctx.strokeStyle = pal.frameInner;
    ctx.lineWidth = 1;
    ctx.strokeRect(60, 60, W - 120, H - 120);

    drawCropMarks(ctx, W, H, pal);

    // catalog header
    let y = 148;
    ctx.fillStyle = faint;
    ctx.font = `500 22px ${FONT_SANS}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    try { ctx.letterSpacing = "0.22em"; } catch (e) {}
    ctx.fillText("ARCHIVE  07", MX, y);
    ctx.textAlign = "right";
    ctx.fillText(result.eyebrow || QUIZ_CONFIG.card.eyebrow, W - MX, y);
    ctx.textAlign = "left";
    ctx.letterSpacing = "0px";

    // header rule
    y = 168;
    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(MX, y);
    ctx.lineTo(W - MX, y);
    ctx.stroke();
    ctx.fillStyle = pal.rule;
    ctx.fillRect(MX, y - 1, 64, 3);

    // badge (sharp museum plate)
    y = 196;
    const badge = result.badge || QUIZ_CONFIG.card.badge;
    ctx.font = `500 22px ${FONT_SANS}`;
    const badgeW = ctx.measureText(badge).width + 44;
    const badgeH = 44;
    ctx.beginPath();
    ctx.rect(MX, y, badgeW, badgeH);
    ctx.fillStyle = pal.badgeBg;
    ctx.fill();
    ctx.fillStyle = pal.badgeText;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(badge, MX + 22, y + badgeH / 2 + 1);

    // title
    y = 430;
    ctx.fillStyle = ink;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const rawLines = (result.nameLines && result.nameLines.length)
      ? result.nameLines
      : wrapText(ctx, result.name, contentW);
    const titleSize = rawLines.length > 1 ? 96 : 108;
    ctx.font = `700 ${titleSize}px ${FONT_SERIF}`;
    const titleLh = titleSize + 14;
    rawLines.forEach((line, i) => {
      ctx.fillText(line, MX, y + i * titleLh);
    });
    y += rawLines.length * titleLh + 16;

    // blue/gold rule under title
    ctx.fillStyle = pal.rule;
    ctx.fillRect(MX, y, 80, 4);
    y += 44;

    // hook
    ctx.fillStyle = pal.hook;
    ctx.font = `400 30px ${FONT_SANS}`;
    const hookLines = wrapText(ctx, result.hook, contentW);
    hookLines.forEach((line) => {
      ctx.fillText(line, MX, y);
      y += 48;
    });
    y += 24;

    // tags — sharp rectangles
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.textBaseline = "middle";
    let tagX = MX;
    const tagY = y;
    const tagH = 50;
    (result.tags || []).slice(0, 3).forEach((tag) => {
      const tw = ctx.measureText(tag).width + 36;
      ctx.beginPath();
      ctx.rect(tagX, tagY, tw, tagH);
      ctx.strokeStyle = pal.tagStroke;
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.fillStyle = ink;
      ctx.textAlign = "center";
      ctx.fillText(tag, tagX + tw / 2, tagY + tagH / 2 + 1);
      tagX += tw + 14;
      ctx.textAlign = "left";
    });
    y = tagY + tagH + 64;

    // quote
    ctx.fillStyle = accent;
    ctx.font = `700 64px ${FONT_SERIF}`;
    ctx.textBaseline = "alphabetic";
    ctx.fillText("「", MX - 6, y);
    y += 16;
    ctx.fillStyle = ink;
    ctx.font = `400 38px ${FONT_SERIF}`;
    const quote = String(result.quote || "").replace(/^[「『]/, "").replace(/[」』]$/, "");
    const quoteLines = wrapText(ctx, quote, contentW - 16);
    quoteLines.forEach((line) => {
      ctx.fillText(line, MX + 8, y);
      y += 62;
    });
    ctx.fillStyle = accent;
    ctx.font = `700 64px ${FONT_SERIF}`;
    ctx.textAlign = "right";
    ctx.fillText("」", W - MX + 6, y + 6);
    ctx.textAlign = "left";
    y += 48;

    // divider
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, y);
    ctx.lineTo(W - MX, y);
    ctx.stroke();
    y += 62;

    // breakdown title
    ctx.fillStyle = faint;
    ctx.font = `500 22px ${FONT_SANS}`;
    try { ctx.letterSpacing = "0.18em"; } catch (e) {}
    ctx.fillText(QUIZ_CONFIG.card.breakdownTitle, MX, y);
    ctx.letterSpacing = "0px";
    y += 52;

    const footerTop = 1728;
    const barCount = Math.max(bars.length, 1);
    const barBlock = Math.min(128, Math.max(100, (footerTop - 40 - y) / barCount));
    bars.forEach((bar) => {
      ctx.fillStyle = ink;
      ctx.font = `500 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(bar.label, MX, y);
      ctx.textAlign = "right";
      ctx.fillText(bar.pct + "%", W - MX, y);
      ctx.textAlign = "left";

      const trackY = y + 22;
      const trackH = 10;
      ctx.fillStyle = sand;
      ctx.fillRect(MX, trackY, contentW, trackH);
      const fillW = Math.max(bar.pct > 0 ? 12 : 0, Math.round(contentW * (bar.pct / 100)));
      if (fillW > 0) {
        ctx.fillStyle = accent;
        ctx.fillRect(MX, trackY, fillW, trackH);
      }
      y += barBlock;
    });

    const fy = 1764;
    if (result.summary) {
      ctx.fillStyle = pal.summary;
      ctx.font = `400 26px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const sumLines = wrapText(ctx, result.summary, contentW);
      const sumLh = 44;
      const sumBlock = sumLines.length * sumLh;
      let sy = y + 8;
      if (sy + sumBlock > fy - 32) {
        sy = Math.max(y, fy - 32 - sumBlock);
      }
      if (sy + sumBlock <= fy - 20) {
        sumLines.forEach((line, i) => {
          ctx.fillText(line, MX, sy + i * sumLh);
        });
      }
    }

    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(MX, fy);
    ctx.lineTo(W - MX, fy);
    ctx.stroke();

    ctx.fillStyle = ink;
    ctx.font = `400 24px ${FONT_SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(result.footer || QUIZ_CONFIG.card.footer, W / 2, fy + 50);
    ctx.fillStyle = faint;
    ctx.font = `400 20px ${FONT_SANS}`;
    ctx.fillText(result.disclaimer || QUIZ_CONFIG.card.disclaimer, W / 2, fy + 90);

    return exportCardImage(canvas);
  }

  render();
  </script>
