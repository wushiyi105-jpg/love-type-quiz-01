<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="你身上最招哪种人？年上、年下，还是同龄。8 道情景题，生成可保存的结果卡。" />
  <title>你身上最招哪种人？</title>
  <style>
    :root {
      --cream: #FAF7F2;
      --ink: #1E1B18;
      --ink-soft: #5C574F;
      --ink-faint: #8A847A;
      --rose: #C85A53;
      --rose-deep: #B04842;
      --rose-soft: rgba(200, 90, 83, 0.12);
      --sand: #EFE8DD;
      --sand-dark: #E4DACB;
      --card: #FFFCF7;
      --line: rgba(30, 27, 24, 0.12);
      --shadow: 0 10px 40px rgba(30, 27, 24, 0.06);
      --font-serif: "Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --font-sans: "Noto Sans CJK SC", "Noto Sans CJK", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }
    button {
      font-family: inherit;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    img { display: block; max-width: 100%; }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      background:
        radial-gradient(1200px 420px at 50% -80px, rgba(200, 90, 83, 0.07), transparent 60%),
        var(--cream);
    }

    .view {
      display: none;
      min-height: 100dvh;
      padding: calc(28px + var(--safe-top)) 22px calc(32px + var(--safe-bottom));
      animation: rise 0.48s ease both;
    }
    .view.is-on { display: flex; flex-direction: column; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Home ===== */
    .home-top { padding-top: 18px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ink-faint);
      text-transform: none;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      flex: 0 0 18px;
      height: 1px;
      background: var(--line);
    }
    .eyebrow::before { flex: 0 0 22px; }
    .home-eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 36px; }

    .home-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(34px, 10vw, 42px);
      line-height: 1.22;
      letter-spacing: 0.04em;
      text-align: center;
      font-feature-settings: "kern";
    }
    .home-title em {
      font-style: normal;
      color: var(--rose);
    }

    .chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 22px 0 28px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
      background: var(--sand);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .home-lead {
      text-align: center;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 20.5em;
      margin: 0 auto 40px;
    }

    .cta-primary {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--cream);
      border-radius: 999px;
      height: 52px;
      font-size: 16px;
      letter-spacing: 0.16em;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .cta-primary:active { transform: scale(0.98); background: #2a2623; }

    .home-meta {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.7;
      letter-spacing: 0.04em;
    }

    .home-footer {
      margin-top: auto;
      padding-top: 48px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.08em;
    }

    .ornament {
      width: 10px;
      height: 10px;
      margin: 0 auto 28px;
      border: 1px solid var(--rose);
      transform: rotate(45deg);
      opacity: 0.7;
    }

    /* ===== Quiz ===== */
    .quiz-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      flex: 0 0 36px;
      transition: background 0.15s ease;
    }
    .back-btn:disabled { opacity: 0.3; }
    .back-btn:not(:disabled):active { background: var(--sand); }
    .progress-wrap { flex: 1; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 3px;
      background: var(--sand-dark);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--rose);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .q-kicker {
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--rose);
    }
    .q-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 23px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 10px 0 28px;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px 14px 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: var(--shadow);
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }
    .option:active { transform: scale(0.985); }
    .option.is-picked {
      border-color: var(--rose);
      background: #fff8f4;
    }
    .opt-key {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      letter-spacing: 0;
      color: var(--ink-soft);
      background: var(--sand);
      margin-top: 1px;
    }
    .option.is-picked .opt-key {
      background: var(--rose);
      color: #fff;
    }
    .opt-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      padding-top: 1px;
    }

    /* ===== Generating / Result ===== */
    .gen-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .gen-mark {
      width: 14px;
      height: 14px;
      border: 1px solid var(--rose);
      transform: rotate(45deg);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: rotate(45deg) scale(0.9); }
      50% { opacity: 1; transform: rotate(45deg) scale(1.05); }
    }
    .gen-text {
      font-family: var(--font-serif);
      font-size: 18px;
      letter-spacing: 0.12em;
    }
    .gen-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; }

    .result-head {
      text-align: center;
      margin-bottom: 16px;
    }
    .result-head .eyebrow { justify-content: center; margin-bottom: 8px; }
    .result-hint {
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
    }

    #result-card-img {
      width: min(100%, calc((100dvh - 220px) * 1080 / 1920));
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(30, 27, 24, 0.12);
      background: var(--sand);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .cta-save {
      height: 48px;
      border-radius: 999px;
      background: var(--rose);
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.12em;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .cta-save:active { transform: scale(0.98); background: var(--rose-deep); }
    .cta-ghost {
      height: 48px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }
    .cta-ghost:active { background: var(--sand); }

    .result-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      line-height: 1.7;
    }


    .save-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .save-lightbox.is-on { display: flex; }
    .save-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 10, 0.86);
    }
    .save-lightbox-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(100%, 420px);
      pointer-events: none;
    }
    .save-lightbox-hint {
      pointer-events: none;
      background: rgba(255, 255, 255, 0.96);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      padding: 8px 16px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    #save-lightbox-img {
      pointer-events: auto;
      max-width: 86vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
    }
    .save-lightbox-close {
      pointer-events: auto;
      min-width: 128px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--cream);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .view, .gen-mark, .progress-fill, .cta-primary, .option { animation: none; transition: none; }
    }
  
    /* —— 兑换码解锁弹窗（不影响封面预览，仅在点击开始后出现） —— */
    .code-gate-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .code-gate-modal.is-on { display: flex; }
    .code-gate-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 18, 16, 0.46);
    }
    .code-gate-panel {
      position: relative;
      z-index: 1;
      width: min(100%, 340px);
      background: var(--card, var(--paper, #fff));
      color: var(--ink);
      border-radius: 20px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow, 0 18px 40px rgba(0,0,0,0.16));
      box-sizing: border-box;
    }
    .code-gate-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--ink-faint, #888);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
    }
    .code-gate-close:active { color: var(--ink); }
    .code-gate-title {
      margin: 0 28px 10px 0;
      font-family: var(--font-serif, serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .code-gate-sub {
      margin: 0 0 18px;
      font-family: var(--font-sans, sans-serif);
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-soft, #555);
    }
    .code-gate-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }
    #code-gate-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid var(--line, rgba(0,0,0,0.16));
      border-radius: 12px;
      background: var(--cream, var(--paper, #fff));
      color: var(--ink);
      font-family: "SF Mono", "Menlo", "Consolas", "Courier New", var(--font-sans, sans-serif);
      font-size: 20px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      outline: none;
    }
    #code-gate-input:focus {
      border-color: var(--rose, var(--blue, var(--ink)));
      box-shadow: 0 0 0 3px var(--rose-soft, var(--blue-soft, rgba(0,0,0,0.08)));
    }
    .code-gate-error {
      margin: 10px 0 0;
      min-height: 0;
      font-family: var(--font-sans, sans-serif);
      font-size: 12px;
      line-height: 1.55;
      color: var(--rose-deep, var(--rose, #B04842));
    }
    .code-gate-error[hidden] { display: none; }
    .code-gate-submit {
      display: block;
      width: 100%;
      margin-top: 16px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-family: var(--font-sans, sans-serif);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .code-gate-submit:active { transform: scale(0.98); }

    .code-gate-submit { background: var(--ink); }
    .code-gate-submit:active { background: #2a2623; }
    .code-gate-panel { border: 1px solid var(--line); }
    </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="save-lightbox" class="save-lightbox" aria-hidden="true">
    <div class="save-lightbox-backdrop" data-lightbox-close></div>
    <div class="save-lightbox-panel">
      <div class="save-lightbox-hint">👆 长按下方图片 → 保存到相册</div>
      <img id="save-lightbox-img" alt="结果卡" />
      <button type="button" class="save-lightbox-close" data-lightbox-close>关闭</button>
    </div>
  </div>

  <div id="code-gate-modal" class="code-gate-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="code-gate-title">
    <div class="code-gate-backdrop" data-code-gate-close></div>
    <div class="code-gate-panel">
      <button type="button" class="code-gate-close" data-code-gate-close aria-label="关闭">×</button>
      <h2 id="code-gate-title" class="code-gate-title">输入 8 位兑换码开启测试</h2>
      <p class="code-gate-sub">在微店订单「查看券码」或短信中复制 8 位码填入即可（本机解锁后可重复测）</p>
      <form id="code-gate-form" autocomplete="off">
        <label class="code-gate-label" for="code-gate-input">8 位兑换码</label>
        <input id="code-gate-input" name="redeem" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="例如 LV7K4M9P" />
        <p id="code-gate-error" class="code-gate-error" role="alert" hidden></p>
        <button type="submit" class="code-gate-submit">验证并开始测试</button>
      </form>
    </div>
  </div>


  <script>
  /* =============================================================================
   * QUIZ_CONFIG — 换题库只需改这一份配置，10 分钟可出新品（选题 2 / 3 / 5 / 7）
   * -----------------------------------------------------------------------------
   * 使用步骤：
   *   1. 改 meta：id / title / subtitle / lead / startLabel / homeFoot
   *   2. 改 questions：8 题为宜，每题 3–4 个 options，禁止开放式填空
   *      每个 option.scores 的 key 必须与 results[].id 一致，分值为 0–4 的整数
   *   3. 改 results：建议 4 档（不要 8 档）。每档需要：
   *        id, name, hook, tags[3], quote, summary
   *   4. 改 breakdown：结果卡上的 3 根百分比条
   *        items[].from  = 直接累加的结果 id
   *        items[].share = 按 50% 均摊进来的结果 id（本选题的「全龄通杀」）
   *   5. 改 card：结果卡眉题、印章字、页脚、文件名前缀
   *   6. （可选）改 hidden：稀有隐藏档。命中 hidden.matches 中不少于
   *        hidden.minHits 条时，优先出隐藏款，不再走普通 4 档计分。
   *        隐藏结果可自带 theme / badge / eyebrow / stamp / footer。
   *   7. 另存为新的 index.html，上传即可发布
   *
   * 计分规则：
   *   先判定隐藏款触发；未触发时，累加 8 题选项的 scores，总分最高的结果档胜出；
   *   平分时取配置里更靠前的那一档。隐藏档不要写入 option.scores，以免污染普通档。
   *   吸引力百分比 = from 得分 + share 得分 × 0.5，再归一化为 100%。
   *
   * 本选题隐藏款触发（写死在 hidden.matches，供自己测 / 截图，不要发到评论区）：
   *   8 题中标定 4 个「高张力 / 高神秘」选项，至少命中 3 个即出「危险上头体质」。
   *   路径占比：C(4,3)×3×4^4 + 4^4 = 3328 / 65536 ≈ 5.08%。
   *     第 1 题 A  「她看起来很好接近，其实谁也拿不准她在想什么。」
   *     第 3 题 D  「先把对话框静音。心情几乎不受影响。」
   *     第 6 题 D  「先看这是真心还是套路，再决定给不给台阶。」
   *     第 7 题 D  「距离感刚刚好。熟了才知道，我其实很会爱人。」
   *   自测推荐完整路径（8 题选项）：A / B / D / B / B / D / D / D
   *   （第 2、4、5、8 题可任选；只要上面 4 条里至少中 3 条，就会出黑金隐藏卡。）
   * ============================================================================= */
  const QUIZ_CONFIG = {
    id: "zhao-na-zhong-ren-01",
    title: "你身上最招哪种人？",
    subtitle: "年上 / 年下 / 同龄",
    kicker: "情感吸引力测试  ·  01",
    lead: "不是在测你喜欢谁。\n是在测，什么样的人会先为你停下来。",
    startLabel: "开始测试",
    homeMeta: "8 道情景题  ·  约 2 分钟\n结束后生成可保存的结果卡",
    homeFoot: "娱乐测试  ·  结果可长按保存分享",
    quizKicker: "情景选择题",

    card: {
      eyebrow: "测试结果",
      badge: "你身上最招哪种人",
      stamp: "招",
      breakdownTitle: "吸引力分布",
      footer: "长按保存结果卡 · 评论区报出你的类型",
      disclaimer: "娱乐测试 · 结果仅供自娱和分享",
      filePrefix: "最招哪种人"
    },

    breakdown: {
      items: [
        { key: "nianshang", label: "年上吸引力", from: ["nianshang"], share: ["allage"] },
        { key: "nianxia",   label: "年下吸引力", from: ["nianxia"],   share: ["allage"] },

  /* =========================  引擎（通常不必改）  ========================= */
  const FONT_SERIF = '"Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif';

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nl2br(s) {
    return escapeHtml(s).replace(/\n/g, "<br>");
  }

  function render() {

    else if (state.screen === "quiz") renderQuiz();

    else if (state.screen === "result") renderResult();
  }

  function formatTitle(title) {
    if (title === "你身上最招哪种人？") {

    }
    const t = escapeHtml(title);

    requestAnimationFrame(() => {
      const fill = app.querySelector(".progress-fill");
      if (fill) fill.style.width = (n / total) * 100 + "%";
    });
    document.getElementById("btn-back").addEventListener("click", goBack);
    app.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => pickOption(Number(btn.dataset.index), btn));
    });

  function goBack() {
    if (state.qIndex === 0) return;
    state.answers.pop();
    state.qIndex -= 1;
    render();
  }

  function pickOption(index, btn) {
    if (app.dataset.locked === "1") return;
    app.dataset.locked = "1";
    btn.classList.add("is-picked");
    state.answers[state.qIndex] = index;
    const last = state.qIndex >= QUIZ_CONFIG.questions.length - 1;
    setTimeout(() => {
      app.dataset.locked = "0";
      if (last) finishQuiz();
      else {
        state.qIndex += 1;
        render();
      }

  function emptyScores() {
    const t = {};
    QUIZ_CONFIG.results.forEach((r) => { t[r.id] = 0; });
    return t;
  }

  function totalsFromAnswers(answers) {
    const t = emptyScores();
    answers.forEach((optIndex, qi) => {
      const opt = QUIZ_CONFIG.questions[qi].options[optIndex];
      if (!opt) return;
      Object.entries(opt.scores).forEach(([k, v]) => {
        t[k] = (t[k] || 0) + v;
      });
    });
    return t;
  }

  function hitsHidden(answers) {
    const hidden = QUIZ_CONFIG.hidden;
    if (!hidden || !hidden.matches || !hidden.matches.length) return false;
    const need = hidden.minHits == null ? hidden.matches.length : hidden.minHits;
    let hits = 0;
    hidden.matches.forEach((m) => {
      if (answers[m.q] === m.option) hits += 1;
    });
    return hits >= need;
  }

  function pickResult(totals, answers) {
    if (hitsHidden(answers) && QUIZ_CONFIG.hidden && QUIZ_CONFIG.hidden.result) {
      return QUIZ_CONFIG.hidden.result;
    }
    let best = QUIZ_CONFIG.results[0];
    let bestScore = -1;
    for (const r of QUIZ_CONFIG.results) {
      const v = totals[r.id] || 0;
      if (v > bestScore) {
        bestScore = v;
        best = r;
      }
    }
    return best;
  }

  function toPercents(values) {
    const sum = values.reduce((a, b) => a + b, 0);
    if (sum <= 0) {
      const even = Math.floor(100 / values.length);
      const arr = values.map(() => even);
      arr[0] += 100 - even * values.length;
      return arr;
    }
    const raw = values.map((v) => (v / sum) * 100);
    const floored = raw.map(Math.floor);
    let remain = 100 - floored.reduce((a, b) => a + b, 0);
    const order = raw
      .map((v, i) => ({ i, frac: v - Math.floor(v) }))
      .sort((a, b) => b.frac - a.frac);
    for (let k = 0; k < remain; k++) floored[order[k % order.length].i] += 1;
    return floored;
  }

  function computeBreakdown(totals) {
    const items = QUIZ_CONFIG.breakdown.items;
    const raw = items.map((item) => {
      let v = 0;
      (item.from || []).forEach((k) => { v += totals[k] || 0; });
      (item.share || []).forEach((k) => { v += (totals[k] || 0) * 0.5; });
      return v;
    });
    const pcts = toPercents(raw);
    return items.map((item, i) => ({
      key: item.key,
      label: item.label,
      raw: raw[i],
      pct: pcts[i]
    }));
  }

  function finishQuiz() {
    const totals = totalsFromAnswers(state.answers);
    state.result = pickResult(totals, state.answers);
    state.bars = computeBreakdown(totals);
    state.screen = "generating";
    render();
    Promise.resolve()
      .then(() => ensureFonts())
      .then(() => new Promise((r) => setTimeout(r, 640)))
      .then(() => drawResultCard(state.result, state.bars))
      .then((url) => {
        state.cardUrl = url;
        state.screen = "result";
        render();
      })
      .catch((err) => {
        console.error(err);
        showToast("结果卡生成失败，请重试");
        state.screen = "home";
        render();
      });
  }

  async function saveOrShareCard() {
    const img = document.getElementById("result-card-img");
    if (!img || !img.src) return;
    const filename = `${QUIZ_CONFIG.card.filePrefix}-${state.result.name}.jpg`;
    const isInApp = /MicroMessenger|xhs|XiaoHongShu|Aweme|Douyin|QQ\/|Weibo/i.test(navigator.userAgent);
    const isIOS = /iP(hone|ad|od)/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isInApp || isIOS) {
      openSaveLightbox(img.src);
      return;
    }

    try {
      const canvas = state.cardCanvas;
      let blob;
      if (canvas && typeof canvas.toBlob === "function") {
        blob = await new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob failed"))), "image/jpeg", state.cardJpegQuality || 0.90);
        });
      } else {
        blob = await (await fetch(img.src)).blob();
      }
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      showToast("已开始下载到手机相册/下载目录");
    } catch (err) {
      openSaveLightbox(img.src);
    }
  }

  function closeSaveLightbox() {
    const box = document.getElementById("save-lightbox");

  function bindSaveLightbox() {
    const box = document.getElementById("save-lightbox");
    if (!box || box.dataset.bound === "1") return;
    box.dataset.bound = "1";
    box.addEventListener("click", (e) => {
      if (e.target && e.target.hasAttribute("data-lightbox-close")) closeSaveLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && box.classList.contains("is-on")) closeSaveLightbox();
    });
  }

  const CODE_GATE = {
    prefix: "LV",
    salt: "clayrose-lv-k7p2qx",
    storageKey: "quiz_unlocked_LV"
  };
  const REDEEM_ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

  function redeemFnv1a(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function redeemChecksum(prefix, payload) {
    const h = redeemFnv1a(CODE_GATE.salt + prefix + payload);
    return REDEEM_ALPHABET[h & 31] + REDEEM_ALPHABET[(h >>> 5) & 31];
  }

  function normalizeRedeemCode(raw) {
    return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  }

  function isValidRedeemCode(raw) {
    const code = normalizeRedeemCode(raw);
    if (code.length !== 8) return false;
    if (code.slice(0, 2) !== CODE_GATE.prefix) return false;
    for (let i = 0; i < 8; i++) {
      if (REDEEM_ALPHABET.indexOf(code[i]) < 0) return false;
    }
    return redeemChecksum(CODE_GATE.prefix, code.slice(2, 6)) === code.slice(6, 8);
  }

  function isQuizUnlocked() {
    try {
      const raw = localStorage.getItem(CODE_GATE.storageKey);
      if (!raw) return false;
      const data = JSON.parse(raw);
      return !!(data && data.code && isValidRedeemCode(data.code));
    } catch (err) {
      return false;
    }
  }

  function persistUnlock(code) {
    try {
      localStorage.setItem(CODE_GATE.storageKey, JSON.stringify({
        code: normalizeRedeemCode(code),
        ts: Date.now()
      }));
    } catch (err) {}
  }

  function requestStartQuiz() {
    if (isQuizUnlocked()) {
      startQuiz();
      return;
    }
    openCodeGate();
  }

  function openCodeGate() {
    const modal = document.getElementById("code-gate-modal");
    const input = document.getElementById("code-gate-input");
    const error = document.getElementById("code-gate-error");
    if (!modal) return;
    if (error) {
      error.hidden = true;
      error.textContent = "";
    }
    if (input) input.value = "";
    modal.classList.add("is-on");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    setTimeout(() => { if (input) input.focus(); }, 40);
  }

  function closeCodeGate() {
    const modal = document.getElementById("code-gate-modal");
    if (!modal) return;
    modal.classList.remove("is-on");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  function submitCodeGate(event) {
    if (event) event.preventDefault();
    const input = document.getElementById("code-gate-input");
    const error = document.getElementById("code-gate-error");
    const raw = input ? input.value : "";
    const code = normalizeRedeemCode(raw);
    if (input) input.value = code;
    if (!isValidRedeemCode(code)) {
      if (error) {
        error.hidden = false;
        error.textContent = "兑换码无效或与当前测试不匹配，请核对微店订单中的 8 位券码";
      }
      if (input) {
        input.focus();
        input.select();
      }
      return;
    }
    persistUnlock(code);
    closeCodeGate();
    startQuiz();
  }

  function bindCodeGate() {
    const modal = document.getElementById("code-gate-modal");
    if (!modal || modal.dataset.bound === "1") return;
    modal.dataset.bound = "1";
    const form = document.getElementById("code-gate-form");
    const input = document.getElementById("code-gate-input");
    if (form) form.addEventListener("submit", submitCodeGate);
    if (input) {
      input.addEventListener("input", () => {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const next = input.value.toUpperCase();
        if (input.value !== next) {
          input.value = next;
          try { input.setSelectionRange(start, end); } catch (err) {}
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitCodeGate(e);
      });
    }
    modal.addEventListener("click", (e) => {
      if (e.target && e.target.hasAttribute("data-code-gate-close")) closeCodeGate();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("is-on")) closeCodeGate();
    });
  }

  bindSaveLightbox();
  bindCodeGate();
  async function ensureFonts() {
    if (!document.fonts) return;
    try { await document.fonts.ready; } catch (e) {}
    const faces = [
      `700 112px ${FONT_SERIF}`,
      `400 42px ${FONT_SERIF}`,
      `700 42px ${FONT_SERIF}`,
      `400 28px ${FONT_SANS}`,
      `500 28px ${FONT_SANS}`,
      `700 30px ${FONT_SANS}`
    ];
    await Promise.all(faces.map((f) => document.fonts.load(f).catch(() => null)));
  }

  function wrapText(ctx, text, maxWidth) {
    const noStart = "。，、；：！？）》」』…";
    const preferred = "。！？；，、 ";
    const out = [];

    function fixOrphans(block) {
      if (block.length < 2) return block;
      const minLast = 5;
      const last = [...block[block.length - 1]];
      if (last.length >= minLast) return block;
      const prev = [...block[block.length - 2]];
      while (last.length < minLast && prev.length > minLast + 1) {
        last.unshift(prev.pop());
      }
      block[block.length - 2] = prev.join("");
      block[block.length - 1] = last.join("");
      return block;
    }

    for (const paragraph of String(text || "").split("\n")) {
      const chars = [...paragraph];
      if (!chars.length) { out.push(""); continue; }
      const para = [];
      let line = "";
      let breakAt = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const test = line + ch;
        const overflow = !!(line && ctx.measureText(test).width > maxWidth && !noStart.includes(ch));
        if (overflow) {
          const arr = [...line];
          if (breakAt >= 4 && breakAt < arr.length) {
            para.push(arr.slice(0, breakAt).join(""));
            line = arr.slice(breakAt).join("");
            breakAt = -1;
            i -= 1;
            continue;
          }
          para.push(line);
          line = "";
          breakAt = -1;
          i -= 1;
          continue;
        }
        line = test;
        if (preferred.includes(ch)) breakAt = [...line].length;
      }
      if (line) para.push(line);
      out.push.apply(out, fixOrphans(para));
    }
    return out;
  }

  function roundedRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function getCardPalette(result) {
    const theme = (result && result.theme) || {};
    const dark = theme.id === "black-gold" || theme.mode === "dark";
    if (dark) {
      const gold = theme.gold || "#D8B26E";
      const ivory = theme.ivory || "#F5EFE6";
      const bg = theme.bg || "#171513";
      return {
        bg: bg,
        wash: "rgba(216,178,110,0.10)",
        ink: ivory,
        accent: gold,
        track: "rgba(216,178,110,0.18)",
        faint: "rgba(245,239,230,0.48)",
        hook: "rgba(245,239,230,0.78)",
        summary: "rgba(245,239,230,0.70)",
        frame: "rgba(216,178,110,0.62)",
        frameInner: "rgba(216,178,110,0.28)",
        divider: "rgba(216,178,110,0.28)",
        tagStroke: "rgba(216,178,110,0.70)",
        badgeBg: gold,
        badgeText: bg,
        grainA: "#000000",
        grainB: "#D8B26E",
        grainAlpha: 0.055
      };
    }
    return {
      bg: "#FAF7F2",
      wash: "rgba(200,90,83,0.07)",
      ink: "#1E1B18",
      accent: "#C85A53",
      track: "#EFE8DD",
      faint: "rgba(30,27,24,0.48)",
      hook: "rgba(30,27,24,0.72)",
      summary: "rgba(30,27,24,0.62)",
      frame: "rgba(30,27,24,0.22)",
      frameInner: "rgba(30,27,24,0.10)",
      divider: "rgba(30,27,24,0.14)",
      tagStroke: "rgba(30,27,24,0.22)",
      badgeBg: "#C85A53",
      badgeText: "#fff",
      grainA: "#1E1B18",
      grainB: "#FFFFFF",
      grainAlpha: 0.045
    };
  }


  function approxDataUrlBytes(url) {
    const i = String(url).indexOf(",");
    const b64 = i >= 0 ? String(url).slice(i + 1) : String(url);
    let pad = 0;
    if (b64.endsWith("==")) pad = 2;
    else if (b64.endsWith("=")) pad = 1;
    return Math.floor(b64.length * 3 / 4) - pad;
  }

  function exportCardImage(canvas) {
    const qualities = [0.90, 0.86, 0.82, 0.78, 0.74];
    const maxBytes = 160 * 1024;
    let chosenQ = qualities[qualities.length - 1];
    let url = canvas.toDataURL("image/jpeg", chosenQ);
    for (const q of qualities) {
      const candidate = canvas.toDataURL("image/jpeg", q);
      chosenQ = q;
      url = candidate;
      if (approxDataUrlBytes(candidate) <= maxBytes) break;
    }
    state.cardCanvas = canvas;
    state.cardJpegQuality = chosenQ;
    return url;
  }

  function drawResultCard(result, bars) {
    const W = 1080;
    const H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const MX = 128;
    const contentW = W - MX * 2;
    const pal = getCardPalette(result);
    const ink = pal.ink;
    const rose = pal.accent;
    const sand = pal.track;
    const cream = pal.bg;
    const faint = pal.faint;

    // background
    ctx.fillStyle = cream;
    ctx.fillRect(0, 0, W, H);
    const wash = ctx.createLinearGradient(0, 0, 0, 640);
    wash.addColorStop(0, pal.wash);
    wash.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, 640);

    // subtle grain under the type (keeps glyphs crisp)
    ctx.save();
    ctx.globalAlpha = pal.grainAlpha;
    for (let i = 0; i < 14000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? pal.grainA : pal.grainB;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
    }
    ctx.restore();

    // double frame
    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, W - 96, H - 96);
    ctx.strokeStyle = pal.frameInner;
    ctx.lineWidth = 1;
    ctx.strokeRect(64, 64, W - 128, H - 128);

    // stamp
    const stamp = result.stamp || QUIZ_CONFIG.card.stamp || "招";
    const sx = W - 168;
    const sy = 168;
    ctx.beginPath();
    ctx.arc(sx, sy, 52, 0, Math.PI * 2);
    ctx.strokeStyle = rose;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, 44, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = rose;
    ctx.font = `700 40px ${FONT_SERIF}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(stamp, sx, sy + 2);

    let y = 150;

    // eyebrow
    ctx.fillStyle = faint;
    ctx.font = `400 22px ${FONT_SANS}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.letterSpacing = "8px";
    try { ctx.letterSpacing = "0.22em"; } catch (e) {}
    ctx.fillText(result.eyebrow || QUIZ_CONFIG.card.eyebrow, MX, y);
    ctx.letterSpacing = "0px";

    // badge
    y = 210;
    const badge = result.badge || QUIZ_CONFIG.card.badge;
    ctx.font = `500 22px ${FONT_SANS}`;
    const badgeW = ctx.measureText(badge).width + 48;
    const badgeH = 44;
    const badgeX = MX;
    roundedRect(ctx, badgeX, y, badgeW, badgeH, 22);
    ctx.fillStyle = pal.badgeBg;
    ctx.fill();
    ctx.fillStyle = pal.badgeText;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(badge, badgeX + 24, y + badgeH / 2 + 1);

    // title
    y = 430;
    ctx.fillStyle = ink;
    ctx.font = `700 108px ${FONT_SERIF}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const titleLines = wrapText(ctx, result.name, contentW);
    const titleSize = titleLines.length > 1 ? 84 : 108;
    ctx.font = `700 ${titleSize}px ${FONT_SERIF}`;
    const titleLines2 = wrapText(ctx, result.name, contentW);
    const titleLh = titleSize + 16;
    titleLines2.forEach((line, i) => {
      ctx.fillText(line, MX, y + i * titleLh);
    });
    y += titleLines2.length * titleLh + 28;

    // hook
    ctx.fillStyle = pal.hook;
    ctx.font = `400 30px ${FONT_SANS}`;
    const hookLines = wrapText(ctx, result.hook, contentW);
    hookLines.forEach((line) => {
      ctx.fillText(line, MX, y);
      y += 48;
    });
    y += 28;

    // tags
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.textBaseline = "middle";
    let tagX = MX;
    const tagY = y;
    const tagH = 52;
    (result.tags || []).slice(0, 3).forEach((tag) => {
      const tw = ctx.measureText(tag).width + 40;
      roundedRect(ctx, tagX, tagY, tw, tagH, 26);
      ctx.strokeStyle = pal.tagStroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = ink;
      ctx.textAlign = "center";
      ctx.fillText(tag, tagX + tw / 2, tagY + tagH / 2 + 1);
      tagX += tw + 16;
      ctx.textAlign = "left";
    });
    y = tagY + tagH + 70;

    // quote
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textBaseline = "alphabetic";
    ctx.fillText("「", MX - 8, y);
    y += 18;
    ctx.fillStyle = ink;
    ctx.font = `400 40px ${FONT_SERIF}`;
    const quote = String(result.quote || "").replace(/^[「『]/, "").replace(/[」』]$/, "");
    const quoteLines = wrapText(ctx, quote, contentW - 20);
    quoteLines.forEach((line) => {
      ctx.fillText(line, MX + 8, y);
      y += 66;
    });
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textAlign = "right";
    ctx.fillText("」", W - MX + 8, y + 8);
    ctx.textAlign = "left";
    y += 56;

    // divider
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, y);
    ctx.lineTo(W - MX, y);
    ctx.stroke();
    y += 70;

    // breakdown title
    ctx.fillStyle = faint;
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.fillText(QUIZ_CONFIG.card.breakdownTitle, MX, y);
    y += 54;

    // bars — reserve footer space so nothing collides
    const footerTop = 1728;
    const barCount = Math.max(bars.length, 1);
    const barBlock = Math.min(140, Math.max(110, (footerTop - 40 - y) / barCount));
    bars.forEach((bar) => {
      ctx.fillStyle = ink;
      ctx.font = `500 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(bar.label, MX, y);
      ctx.textAlign = "right";
      ctx.fillText(bar.pct + "%", W - MX, y);
      ctx.textAlign = "left";

      const trackY = y + 24;
      const trackH = 16;
      roundedRect(ctx, MX, trackY, contentW, trackH, 8);
      ctx.fillStyle = sand;
      ctx.fill();
      const fillW = Math.max(bar.pct > 0 ? 16 : 0, Math.round(contentW * (bar.pct / 100)));
      if (fillW > 0) {
        roundedRect(ctx, MX, trackY, fillW, trackH, 8);
        ctx.fillStyle = rose;
        ctx.fill();
      }
      y += barBlock;
    });

    // summary, if it still fits above the pinned footer
    const fy = 1764;
    if (result.summary) {
      ctx.fillStyle = pal.summary;
      ctx.font = `400 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const sumLines = wrapText(ctx, result.summary, contentW);
      const sumLh = 48;
      const sumBlock = sumLines.length * sumLh;
      let sy = y + 12;
      if (sy + sumBlock > fy - 36) {
        sy = Math.max(y, fy - 36 - sumBlock);
      }
      if (sy + sumBlock <= fy - 24) {
        sumLines.forEach((line, i) => {
          ctx.fillText(line, MX, sy + i * sumLh);
        });
      }
    }

    // footer pinned
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, fy);
    ctx.lineTo(W - MX, fy);
    ctx.stroke();

    ctx.fillStyle = ink;
    ctx.font = `400 24px ${FONT_SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(result.footer || QUIZ_CONFIG.card.footer, W / 2, fy + 50);
    ctx.fillStyle = faint;
    ctx.font = `400 20px ${FONT_SANS}`;
    ctx.fillText(result.disclaimer || QUIZ_CONFIG.card.disclaimer, W / 2, fy + 90);

    return exportCardImage(canvas);
  }

  render();
  </script>
</body>
</html>
