<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F4F7" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="测你是哪种打工人？班味浓度、职场段位。8 道工位情景题，生成可保存的电子工牌。" />
  <title>测你是哪种打工人？</title>
  <style>
    :root {
      --paper: #F2F4F7;
      --cream: #F2F4F7;
      --ink: #1E293B;
      --ink-soft: #334155;
      --ink-faint: #64748B;
      --espresso: #7C4F2B;
      --rose: #7C4F2B;
      --rose-deep: #5C3A1F;
      --rose-soft: rgba(255, 224, 102, 0.35);
      --highlight: #FFE066;
      --highlight-deep: #F5C518;
      --navy: #1E293B;
      --sand: #E8EDF3;
      --sand-dark: #D5DCE6;
      --card: #FFFFFF;
      --line: rgba(30, 41, 59, 0.14);
      --shadow: 0 12px 36px rgba(30, 41, 59, 0.08);
      --font-serif: "Noto Serif CJK SC", "Noto Serif CJK", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --font-sans: "Noto Sans CJK SC", "Noto Sans CJK", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --obsidian: #13151A;
      --gold: #D8B26E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background-color: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }
    button {
      font-family: inherit;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    img { display: block; max-width: 100%; }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      background-color: var(--paper);
      background-image:
        radial-gradient(rgba(30, 41, 59, 0.09) 1px, transparent 1.2px),
        linear-gradient(rgba(30, 41, 59, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.035) 1px, transparent 1px);
      background-size: 18px 18px, 36px 36px, 36px 36px;
      background-position: 0 0, 0 0, 0 0;
    }

    .view {
      display: none;
      min-height: 100dvh;
      padding: calc(22px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
      animation: rise 0.48s ease both;
    }
    .view.is-on { display: flex; flex-direction: column; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Home: electronic ID badge ===== */
    .lanyard {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
      margin-bottom: -16px;
    }
    .lanyard-strap {
      width: 16px;
      height: 26px;
      background: linear-gradient(180deg, #1E293B, #334155);
      border-radius: 2px 2px 0 0;
    }
    .lanyard-hole {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--paper);
      border: 3px solid var(--navy);
      box-shadow:
        inset 0 0 0 6px #fff,
        inset 0 0 0 8px var(--navy),
        0 2px 0 rgba(30, 41, 59, 0.12);
    }

    .badge-card {
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 18px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .badge-card::before {
      content: "";
      position: absolute;
      top: 72px;
      right: -36px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 10px solid rgba(124, 79, 43, 0.07);
      pointer-events: none;
      transform: rotate(-12deg);
    }

    .badge-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
      margin-bottom: 18px;
    }
    .badge-topbar .clock {
      color: var(--espresso);
      font-weight: 500;
    }

    .home-eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.20em;
      color: var(--ink-faint);
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      flex: 0 0 18px;
      height: 1px;
      background: var(--line);
    }
    .eyebrow::before { flex: 0 0 22px; }

    .home-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(32px, 9.2vw, 40px);
      line-height: 1.22;
      letter-spacing: 0.04em;
      text-align: center;
      font-feature-settings: "kern";
    }
    .home-title em {
      font-style: normal;
      background-image: linear-gradient(transparent 58%, var(--highlight) 58%, var(--highlight) 92%, transparent 92%);
      color: var(--ink);
      padding: 0 0.06em;
    }

    .chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 22px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      background: var(--sand);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .home-lead {
      text-align: center;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 21em;
      margin: 0 auto 28px;
    }

    .cta-primary {
      display: block;
      width: 100%;
      background: var(--navy);
      color: #fff;
      border-radius: 8px;
      height: 52px;
      font-size: 16px;
      letter-spacing: 0.14em;
      position: relative;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
    }
    .cta-primary::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--highlight);
      transform: translateY(-50%);
    }
    .cta-primary:active { transform: scale(0.98); background: #0F172A; }

    .home-meta {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.7;
      letter-spacing: 0.04em;
    }

    .barcode {
      height: 32px;
      margin: 22px 12px 8px;
      background: repeating-linear-gradient(
        90deg,
        #1E293B 0 2px,
        transparent 2px 3.5px,
        #1E293B 3.5px 5px,
        transparent 5px 8px,
        #1E293B 8px 9px,
        transparent 9px 11px,
        #1E293B 11px 14px,
        transparent 14px 16px
      );
      opacity: 0.82;
      border-radius: 1px;
    }

    .home-footer {
      margin-top: 4px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.08em;
    }

    .ornament {
      width: 8px;
      height: 8px;
      margin: 0 auto 16px;
      background: var(--highlight);
      border: 1px solid var(--navy);
      transform: rotate(45deg);
    }

    /* ===== Quiz ===== */
    .quiz-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      flex: 0 0 36px;
      background: #fff;
      transition: background 0.15s ease;
    }
    .back-btn:disabled { opacity: 0.3; }
    .back-btn:not(:disabled):active { background: var(--sand); }
    .progress-wrap { flex: 1; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 4px;
      background: var(--sand-dark);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--highlight);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .q-kicker {
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--espresso);
    }
    .q-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 10px 0 24px;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: var(--shadow);
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }
    .option:active { transform: scale(0.985); }
    .option.is-picked {
      border-color: var(--navy);
      background: #FFF8D6;
    }
    .opt-key {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      letter-spacing: 0;
      color: var(--ink-soft);
      background: var(--sand);
      margin-top: 1px;
    }
    .option.is-picked .opt-key {
      background: var(--navy);
      color: var(--highlight);
    }
    .opt-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      padding-top: 1px;
    }

    /* ===== Generating / Result ===== */
    .gen-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .gen-mark {
      width: 14px;
      height: 14px;
      background: var(--highlight);
      border: 1px solid var(--navy);
      transform: rotate(45deg);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: rotate(45deg) scale(0.9); }
      50% { opacity: 1; transform: rotate(45deg) scale(1.05); }
    }
    .gen-text {
      font-family: var(--font-serif);
      font-size: 18px;
      letter-spacing: 0.12em;
    }
    .gen-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; }

    .result-head {
      text-align: center;
      margin-bottom: 16px;
    }
    .result-head .eyebrow { justify-content: center; margin-bottom: 8px; }
    .result-hint {
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
    }

    #result-card-img {
      width: min(100%, calc((100dvh - 220px) * 1080 / 1920));
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(30, 41, 59, 0.14);
      background: var(--sand);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
      pointer-events: auto;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .cta-save {
      height: 48px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.12em;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .cta-save:active { transform: scale(0.98); background: #0F172A; }
    .cta-ghost {
      height: 48px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }
    .cta-ghost:active { background: var(--sand); }

    .result-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      line-height: 1.7;
    }


    .save-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .save-lightbox.is-on { display: flex; }
    .save-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 10, 0.86);
    }
    .save-lightbox-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(100%, 420px);
      pointer-events: none;
    }
    .save-lightbox-hint {
      pointer-events: none;
      background: rgba(255, 255, 255, 0.96);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      padding: 8px 16px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    #save-lightbox-img {
      pointer-events: auto;
      max-width: 86vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      touch-action: auto;
    }
    .save-lightbox-close {
      pointer-events: auto;
      min-width: 128px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .view, .gen-mark, .progress-fill, .cta-primary, .option { animation: none; transition: none; }
    }

  
    /* —— 兑换码解锁弹窗（不影响封面预览，仅在点击开始后出现） —— */
    .code-gate-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-bottom, 0px));
      box-sizing: border-box;
    }
    .code-gate-modal.is-on { display: flex; }
    .code-gate-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 18, 16, 0.46);
    }
    .code-gate-panel {
      position: relative;
      z-index: 1;
      width: min(100%, 340px);
      background: var(--card, var(--paper, #fff));
      color: var(--ink);
      border-radius: 20px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow, 0 18px 40px rgba(0,0,0,0.16));
      box-sizing: border-box;
    }
    .code-gate-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--ink-faint, #888);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
    }
    .code-gate-close:active { color: var(--ink); }
    .code-gate-title {
      margin: 0 28px 10px 0;
      font-family: var(--font-serif, serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .code-gate-sub {
      margin: 0 0 18px;
      font-family: var(--font-sans, sans-serif);
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-soft, #555);
    }
    .code-gate-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }
    #code-gate-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid var(--line, rgba(0,0,0,0.16));
      border-radius: 12px;
      background: var(--cream, var(--paper, #fff));
      color: var(--ink);
      font-family: "SF Mono", "Menlo", "Consolas", "Courier New", var(--font-sans, sans-serif);
      font-size: 20px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      outline: none;
    }
    #code-gate-input:focus {
      border-color: var(--rose, var(--blue, var(--ink)));
      box-shadow: 0 0 0 3px var(--rose-soft, var(--blue-soft, rgba(0,0,0,0.08)));
    }
    .code-gate-error {
      margin: 10px 0 0;
      min-height: 0;
      font-family: var(--font-sans, sans-serif);
      font-size: 12px;
      line-height: 1.55;
      color: var(--rose-deep, var(--rose, #B04842));
    }
    .code-gate-error[hidden] { display: none; }
    .code-gate-submit {
      display: block;
      width: 100%;
      margin-top: 16px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-family: var(--font-sans, sans-serif);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .code-gate-submit:active { transform: scale(0.98); }

    .code-gate-panel {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 16px 40px rgba(30, 41, 59, 0.12);
    }
    .code-gate-title {
      font-family: var(--font-sans, sans-serif);
      letter-spacing: 0.04em;
    }
    .code-gate-panel::before {
      content: "";
      display: block;
      height: 6px;
      margin: -28px -22px 18px;
      background: var(--highlight, #FFE066);
      border-radius: 8px 8px 0 0;
    }
    #code-gate-input {
      border-radius: 6px;
      background: var(--paper);
      letter-spacing: 0.2em;
    }
    .code-gate-submit {
      border-radius: 6px;
      background: var(--navy, #1E293B);
    }
    .code-gate-submit:active { background: #0F172A; }
    
    .code-gate-auto-badge {
      margin: 0 0 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--rose-soft, var(--blue-soft, rgba(0, 0, 0, 0.06)));
      color: var(--ink);
      font-family: var(--font-sans, sans-serif);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
      letter-spacing: 0.02em;
    }
    </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="save-lightbox" class="save-lightbox" aria-hidden="true">
    <div class="save-lightbox-backdrop" data-lightbox-close></div>
    <div class="save-lightbox-panel">
      <div class="save-lightbox-hint">👆 长按下方图片 → 保存到相册</div>
      <img id="save-lightbox-img" alt="结果卡" />
      <button type="button" class="save-lightbox-close" data-lightbox-close>关闭</button>
    </div>
  </div>

  <div id="code-gate-modal" class="code-gate-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="code-gate-title">
    <div class="code-gate-backdrop" data-code-gate-close></div>
    <div class="code-gate-panel">
      <button type="button" class="code-gate-close" data-code-gate-close aria-label="关闭">×</button>
      <h2 id="code-gate-title" class="code-gate-title">输入 8 位兑换码开启测试</h2>
      <p class="code-gate-sub">在微店订单「查看券码」或短信中复制 8 位码填入即可（本机解锁后可重复测）</p>
      <form id="code-gate-form" autocomplete="off">
        <label class="code-gate-label" for="code-gate-input">8 位兑换码</label>
        <input id="code-gate-input" name="redeem" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="例如 WK7K4M9P" />
        <p id="code-gate-error" class="code-gate-error" role="alert" hidden></p>
        <button type="submit" class="code-gate-submit">验证并开始测试</button>
      </form>
    </div>
  </div>


  <script>
  /* =============================================================================
   * QUIZ_CONFIG — 选题 5《测你是哪种打工人（班味浓度 / 职场段位）》

  function totalsFromAnswers(answers) {
    const t = emptyScores();
    answers.forEach((optIndex, qi) => {
      const opt = QUIZ_CONFIG.questions[qi].options[optIndex];
      if (!opt) return;
      Object.entries(opt.scores).forEach(([k, v]) => {

    return t;

    let hits = 0;
    hidden.matches.forEach((m) => {
      if (answers[m.q] === m.option) hits += 1;
    });
    return hits >= need;
  }

  function pickResult(totals, answers) {
    if (hitsHidden(answers) && QUIZ_CONFIG.hidden && QUIZ_CONFIG.hidden.result) {
      return QUIZ_CONFIG.hidden.result;

    let best = QUIZ_CONFIG.results[0];
    let bestScore = -1;
    for (const r of QUIZ_CONFIG.results) {
      const v = totals[r.id] || 0;
      if (v > bestScore) {
        bestScore = v;
        best = r;
      }
    }
    return best;
  }

  function toPercents(values) {
    const sum = values.reduce((a, b) => a + b, 0);
    if (sum <= 0) {
      const even = Math.floor(100 / values.length);
      const arr = values.map(() => even);
      arr[0] += 100 - even * values.length;
      return arr;
    }
    const raw = values.map((v) => (v / sum) * 100);
    const floored = raw.map(Math.floor);
    let remain = 100 - floored.reduce((a, b) => a + b, 0);
    const order = raw
      .map((v, i) => ({ i, frac: v - Math.floor(v) }))
      .sort((a, b) => b.frac - a.frac);
    for (let k = 0; k < remain; k++) floored[order[k % order.length].i] += 1;
    return floored;
  }

  function computeBreakdown(totals) {
    const items = QUIZ_CONFIG.breakdown.items;
    const raw = items.map((item) => {
      let v = 0;
      (item.from || []).forEach((k) => { v += totals[k] || 0; });
      (item.share || []).forEach((k) => { v += (totals[k] || 0) * 0.5; });
      return v;
    });
    const pcts = toPercents(raw);
    return items.map((item, i) => ({
      key: item.key,
      label: item.label,
      raw: raw[i],
      pct: pcts[i]
    }));
  }

  const CODE_GATE = {
    prefix: "WK",
    salt: "badgeclock-wk-h9t4vm",
    storageKey: "quiz_unlocked_WK"
  };
  const REDEEM_ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

  function redeemFnv1a(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function redeemChecksum(prefix, payload) {
    const h = redeemFnv1a(CODE_GATE.salt + prefix + payload);
    return REDEEM_ALPHABET[h & 31] + REDEEM_ALPHABET[(h >>> 5) & 31];
  }

  function normalizeRedeemCode(raw) {
    return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  }

  function isValidRedeemCode(raw) {
    const code = normalizeRedeemCode(raw);
    if (code.length !== 8) return false;
    if (code.slice(0, 2) !== CODE_GATE.prefix) return false;
    for (let i = 0; i < 8; i++) {
      if (REDEEM_ALPHABET.indexOf(code[i]) < 0) return false;
    }
    return redeemChecksum(CODE_GATE.prefix, code.slice(2, 6)) === code.slice(6, 8);
  }

  function isQuizUnlocked() {
    try {
      const raw = localStorage.getItem(CODE_GATE.storageKey);
      if (!raw) return false;
      const data = JSON.parse(raw);
      return !!(data && data.code && isValidRedeemCode(data.code));
    } catch (err) {
      return false;
    }
  }

  function persistUnlock(code) {
    try {
      localStorage.setItem(CODE_GATE.storageKey, JSON.stringify({
        code: normalizeRedeemCode(code),
        ts: Date.now()
      }));
    } catch (err) {}
  }

    if (!String(raw).trim()) return false;
    const code = normalizeRedeemCode(raw);
    if (!isValidRedeemCode(code)) return false;
    persistUnlock(code);
    codeGateAutoUnlocked = true;
    try {
      history.replaceState({}, "", window.location.pathname + window.location.hash);

  function wrapText(ctx, text, maxWidth) {
    const noStart = "。，、；：！？）》」』…";
    const preferred = "。！？；，、 ";
    const out = [];

    function fixOrphans(block) {
      if (block.length < 2) return block;
      const minLast = 5;
      const last = [...block[block.length - 1]];
      if (last.length >= minLast) return block;
      const prev = [...block[block.length - 2]];
      while (last.length < minLast && prev.length > minLast + 1) {
        last.unshift(prev.pop());
      }
      block[block.length - 2] = prev.join("");
      block[block.length - 1] = last.join("");
      return block;
    }

    for (const paragraph of String(text || "").split("\n")) {
      const chars = [...paragraph];
      if (!chars.length) { out.push(""); continue; }
      const para = [];
      let line = "";
      let breakAt = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const test = line + ch;
        const overflow = !!(line && ctx.measureText(test).width > maxWidth && !noStart.includes(ch));
        if (overflow) {
          const arr = [...line];
          if (breakAt >= 4 && breakAt < arr.length) {
            para.push(arr.slice(0, breakAt).join(""));
            line = arr.slice(breakAt).join("");
            breakAt = -1;
            i -= 1;
            continue;
          }
          para.push(line);
          line = "";
          breakAt = -1;
          i -= 1;
          continue;
        }
        line = test;
        if (preferred.includes(ch)) breakAt = [...line].length;
      }
      if (line) para.push(line);
      out.push.apply(out, fixOrphans(para));
    }
    return out;
  }

  function roundedRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBarcode(ctx, x, y, w, h, seed, color) {
    let s = 2166136261;
    const str = String(seed || "WK-05");
    for (let i = 0; i < str.length; i++) {
      s ^= str.charCodeAt(i);
      s = Math.imul(s, 16777619);
    }
    let px = x;
    ctx.fillStyle = color;
    while (px < x + w) {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      const bw = 1 + (s % 4);
      if (s & 1) {
        ctx.fillRect(px, y, bw, h);
      }
      px += bw + (s % 2);
    }
  }

  function drawLanyardHole(ctx, cx, cy, pal) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    ctx.fillStyle = pal.mode === "vip" ? pal.accent : pal.ink;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
    ctx.fillStyle = pal.holeFill;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
    ctx.fillStyle = pal.mode === "vip" ? pal.bg : "#E8EDF3";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
    ctx.strokeStyle = pal.mode === "vip" ? pal.accent : pal.ink;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawPunchStamp(ctx, sx, sy, pal, ch) {
    ctx.save();
    ctx.strokeStyle = pal.mode === "vip" ? pal.accent : pal.espresso;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, 54, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.arc(sx, sy, 44, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 * i) / 12 - Math.PI / 2;
      const r1 = i % 3 === 0 ? 36 : 38;
      const r2 = 42;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a) * r1, sy + Math.sin(a) * r1);
      ctx.lineTo(sx + Math.cos(a) * r2, sy + Math.sin(a) * r2);
      ctx.lineWidth = i % 3 === 0 ? 2.5 : 1.25;
      ctx.stroke();
    }
    ctx.fillStyle = pal.mode === "vip" ? pal.accent : pal.espresso;
    ctx.font = `700 40px ${FONT_SERIF}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ch, sx, sy + 2);
    ctx.restore();
  }


  function approxDataUrlBytes(url) {
    const i = String(url).indexOf(",");
    const b64 = i >= 0 ? String(url).slice(i + 1) : String(url);
    let pad = 0;
    if (b64.endsWith("==")) pad = 2;
    else if (b64.endsWith("=")) pad = 1;
    return Math.floor(b64.length * 3 / 4) - pad;
  }

  function exportCardImage(canvas) {
    const qualities = [0.90, 0.86, 0.82, 0.78, 0.74];
    const maxBytes = 160 * 1024;
    let chosenQ = qualities[qualities.length - 1];
    let url = canvas.toDataURL("image/jpeg", chosenQ);
    for (const q of qualities) {
      const candidate = canvas.toDataURL("image/jpeg", q);
      chosenQ = q;
      url = candidate;
      if (approxDataUrlBytes(candidate) <= maxBytes) break;
    }
    state.cardCanvas = canvas;
    state.cardJpegQuality = chosenQ;
    return url;
  }

  function drawResultCard(result, bars) {
    const W = 1080;
    const H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const MX = 128;
    const contentW = W - MX * 2;
    const pal = getCardPalette(result);
    const ink = pal.ink;
    const rose = pal.mode === "vip" ? pal.accent : pal.espresso;
    const sand = pal.track;
    const cream = pal.bg;
    const faint = pal.faint;
    const isVip = pal.mode === "vip";

    // background
    ctx.fillStyle = cream;
    ctx.fillRect(0, 0, W, H);
    const wash = ctx.createLinearGradient(0, 0, 0, 640);
    wash.addColorStop(0, pal.wash);
    wash.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, 640);

    // office dot-grid (skip a disc around the lanyard hole)
    ctx.save();
    ctx.fillStyle = pal.grid;
    for (let gy = 72; gy < H - 72; gy += 22) {
      for (let gx = 72; gx < W - 72; gx += 22) {
        const dx = gx - W / 2;
        const dy = gy - 108;
        if (dx * dx + dy * dy < 40 * 40) continue;
        ctx.fillRect(gx, gy, 1.6, 1.6);
      }
    }
    ctx.restore();

    // subtle grain
    ctx.save();
    ctx.globalAlpha = pal.grainAlpha;
    for (let i = 0; i < 14000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? pal.grainA : pal.grainB;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
    }
    ctx.restore();

    // faint coffee ring (normal cards only)
    if (!isVip) {
      ctx.save();
      ctx.translate(940, 520);
      ctx.rotate(-0.22);
      ctx.strokeStyle = "rgba(124,79,43,0.10)";
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.ellipse(0, 0, 86, 80, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(124,79,43,0.07)";
      ctx.beginPath();
      ctx.ellipse(8, -4, 70, 64, 0, 0.4, 5.2);
      ctx.stroke();
      ctx.restore();
    }

    // double frame — slightly tighter at the top to leave room for the lanyard hole
    ctx.strokeStyle = pal.frame;
    ctx.lineWidth = isVip ? 2.5 : 2;
    ctx.strokeRect(48, 48, W - 96, H - 96);
    ctx.strokeStyle = pal.frameInner;
    ctx.lineWidth = 1;
    ctx.strokeRect(64, 64, W - 128, H - 128);

    // lanyard hole sitting on the top edge, like a physical badge
    drawLanyardHole(ctx, W / 2, 108, pal);

    // punch-clock stamp
    const stamp = result.stamp || QUIZ_CONFIG.card.stamp || "工";
    drawPunchStamp(ctx, W - 176, 214, pal, stamp);

    let y = 176;

    // eyebrow
    ctx.fillStyle = faint;
    ctx.font = `400 22px ${FONT_SANS}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    try { ctx.letterSpacing = "0.22em"; } catch (e) {}
    ctx.fillText(result.eyebrow || QUIZ_CONFIG.card.eyebrow, MX, y);
    ctx.letterSpacing = "0px";

    // badge
    y = 210;
    const badge = result.badge || QUIZ_CONFIG.card.badge;
    ctx.font = `600 22px ${FONT_SANS}`;
    const badgeW = Math.min(contentW - 160, ctx.measureText(badge).width + 48);
    const badgeH = 44;
    const badgeX = MX;
    roundedRect(ctx, badgeX, y, badgeW, badgeH, 6);
    ctx.fillStyle = pal.badgeBg;
    ctx.fill();
    ctx.fillStyle = pal.badgeText;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(badge, badgeX + 24, y + badgeH / 2 + 1);

    // ID + punch timestamp
    y = 292;
    ctx.fillStyle = faint;
    ctx.font = `500 20px ${FONT_SANS}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const idCode = "ID  ·  WK-05-" + String(result.id || "XXXX").replace(/hidden-/, "").slice(0, 6).toUpperCase();
    ctx.fillText(idCode, MX, y);
    ctx.textAlign = "right";
    ctx.fillText(isVip ? "ACCESS  ·  GRANTED" : "PUNCHED  ·  FRI  17:58", W - MX, y);
    ctx.textAlign = "left";

    // title
    y = 430;
    ctx.fillStyle = ink;
    ctx.font = `700 108px ${FONT_SERIF}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const titleLines = wrapText(ctx, result.name, contentW);
    const titleSize = titleLines.length > 1 ? 84 : 100;
    ctx.font = `700 ${titleSize}px ${FONT_SERIF}`;
    const titleLines2 = wrapText(ctx, result.name, contentW);
    const titleLh = titleSize + 16;
    // highlighter underline under the type name on normal cards
    if (!isVip) {
      const last = titleLines2[titleLines2.length - 1];
      const tw = ctx.measureText(last).width;
      ctx.fillStyle = "#FFE066";
      ctx.fillRect(MX - 6, y + (titleLines2.length - 1) * titleLh + 8, tw + 12, 18);
      ctx.fillStyle = ink;
    }
    titleLines2.forEach((line, i) => {
      ctx.fillText(line, MX, y + i * titleLh);
    });
    y += titleLines2.length * titleLh + 32;

    // hook
    ctx.fillStyle = pal.hook;
    ctx.font = `400 30px ${FONT_SANS}`;
    const hookLines = wrapText(ctx, result.hook, contentW);
    hookLines.forEach((line) => {
      ctx.fillText(line, MX, y);
      y += 48;
    });
    y += 28;

    // tags
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.textBaseline = "middle";
    let tagX = MX;
    const tagY = y;
    const tagH = 52;
    (result.tags || []).slice(0, 3).forEach((tag, ti) => {
      const tw = ctx.measureText(tag).width + 40;
      roundedRect(ctx, tagX, tagY, tw, tagH, 6);
      if (!isVip && ti === 0) {
        ctx.fillStyle = "#FFE066";
        ctx.fill();
        ctx.fillStyle = ink;
      } else {
        ctx.strokeStyle = pal.tagStroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = ink;
      }
      ctx.textAlign = "center";
      ctx.fillText(tag, tagX + tw / 2, tagY + tagH / 2 + 1);
      tagX += tw + 16;
      ctx.textAlign = "left";
    });
    y = tagY + tagH + 70;

    // quote
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textBaseline = "alphabetic";
    ctx.fillText("「", MX - 8, y);
    y += 18;
    ctx.fillStyle = ink;
    ctx.font = `400 40px ${FONT_SERIF}`;
    const quote = String(result.quote || "").replace(/^[「『]/, "").replace(/[」』]$/, "");
    const quoteLines = wrapText(ctx, quote, contentW - 20);
    quoteLines.forEach((line) => {
      ctx.fillText(line, MX + 8, y);
      y += 66;
    });
    ctx.fillStyle = rose;
    ctx.font = `700 72px ${FONT_SERIF}`;
    ctx.textAlign = "right";
    ctx.fillText("」", W - MX + 8, y + 8);
    ctx.textAlign = "left";
    y += 56;

    // divider
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, y);
    ctx.lineTo(W - MX, y);
    ctx.stroke();
    y += 70;

    // breakdown title
    ctx.fillStyle = faint;
    ctx.font = `500 24px ${FONT_SANS}`;
    ctx.fillText(QUIZ_CONFIG.card.breakdownTitle, MX, y);
    y += 54;

    // bars — reserve footer + barcode space
    const footerTop = 1688;
    const barCount = Math.max(bars.length, 1);
    const barBlock = Math.min(140, Math.max(110, (footerTop - 40 - y) / barCount));
    bars.forEach((bar, bi) => {
      ctx.fillStyle = ink;
      ctx.font = `500 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(bar.label, MX, y);
      ctx.textAlign = "right";
      ctx.fillText(bar.pct + "%", W - MX, y);
      ctx.textAlign = "left";

      const trackY = y + 24;
      const trackH = 16;
      roundedRect(ctx, MX, trackY, contentW, trackH, 3);
      ctx.fillStyle = sand;
      ctx.fill();
      const fillW = Math.max(bar.pct > 0 ? 16 : 0, Math.round(contentW * (bar.pct / 100)));
      if (fillW > 0) {
        roundedRect(ctx, MX, trackY, fillW, trackH, 3);
        // 班味浓度 uses espresso; others use navy / gold
        ctx.fillStyle = (!isVip && bi === 0) ? "#7C4F2B" : (isVip ? pal.accent : pal.ink);
        ctx.fill();
      }
      y += barBlock;
    });

    // summary, if it still fits above the barcode
    const fy = 1764;
    const barcodeY = 1696;
    if (result.summary) {
      ctx.fillStyle = pal.summary;
      ctx.font = `400 28px ${FONT_SANS}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const sumLines = wrapText(ctx, result.summary, contentW);
      const sumLh = 48;
      const sumBlock = sumLines.length * sumLh;
      let sy = y + 12;
      if (sy + sumBlock > barcodeY - 24) {
        sy = Math.max(y, barcodeY - 24 - sumBlock);
      }
      if (sy + sumBlock <= barcodeY - 16) {
        sumLines.forEach((line, i) => {
          ctx.fillText(line, MX, sy + i * sumLh);
        });
      }
    }

    // barcode above pinned footer
    drawBarcode(ctx, MX, barcodeY, contentW, 36, (result.id || "") + (result.name || ""), isVip ? pal.accent : pal.ink);

    // footer pinned
    ctx.strokeStyle = pal.divider;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(MX, fy);
    ctx.lineTo(W - MX, fy);
    ctx.stroke();

    ctx.fillStyle = ink;
    ctx.font = `400 24px ${FONT_SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(result.footer || QUIZ_CONFIG.card.footer, W / 2, fy + 50);
    ctx.fillStyle = faint;
    ctx.font = `400 20px ${FONT_SANS}`;
    ctx.fillText(result.disclaimer || QUIZ_CONFIG.card.disclaimer, W / 2, fy + 90);

    return exportCardImage(canvas);
  }


  render();
  </script>
